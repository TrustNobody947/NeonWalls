<title>Wackelkontakt</title>
<style>
/* Layout: one full-screen canvas, single dark look; tapping the canvas reveals a control sheet */
:root{
  --bg:#000;
  --panel:rgba(12,14,18,.9);
  --fg:#e8ecf2;
  --muted:#8a93a3;
  --accent:#ff3d9a;
  --line:rgba(255,255,255,.12);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
:root{padding:0!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;
  background:var(--panel);padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  transition:opacity .6s;pointer-events:none;white-space:nowrap;z-index:5}
.hint.msg{white-space:normal;text-transform:none;letter-spacing:0;font:500 13px/1.45 var(--font);color:var(--fg);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;border-radius:14px}
.hint.gone{opacity:0}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;
  font:14px/1.4 var(--font);display:grid;gap:14px;backdrop-filter:blur(8px)}
.sheet h2{margin:0;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
#controls{display:grid;gap:14px}
.row{display:grid;gap:6px}
.row label,.row .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.row output{font:12px var(--mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row input[type=text]{width:100%;box-sizing:border-box;font:600 15px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:13px}
.seg button.on{background:var(--accent);color:#000;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid .grp{grid-column:1/-1;margin-top:6px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid button{min-width:0;padding:10px 8px;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.on{background:var(--accent);color:#000;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 auto;font:600 14px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#000;border-color:transparent}
</style>

<canvas id="c" aria-label="Animierter Hintergrund: Bildstörungen wie bei einem Wackelkontakt im Displaykabel"></canvas>
<div class="hint" id="hint">Tippen für Einstellungen</div>

<div class="sheet" id="sheet" hidden>
  <h2>Wackelkontakt</h2>
  <p class="sub">Ein loses Displaykabel: meist Ruhe, dann reißt das Bild in bunten Störstreifen auf.</p>
  <div id="controls"></div>
  <div class="btns">
    <button id="newBtn" class="primary" type="button">Neues Muster</button>
    <button id="actBtn" type="button">Effekt</button>
    <button id="fsBtn" type="button">Vollbild</button>
    <button id="closeBtn" type="button">Schließen</button>
  </div>
</div>

<script>
(() => {
'use strict';
// Hilfsfunktionen für alle Effekte
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lvl = v => v == 0 ? 'aus' : v < 4 ? 'leicht' : v < 7 ? 'mittel' : 'stark';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
// Wahrscheinlichkeit für "rate mal pro Sekunde" bei Zeitschritt dt
const per = (rate, dt) => 1 - Math.exp(-rate * dt);

// ---------- Effekt ----------
const E = (function () {
// Wackelkontakt: ein loses Displaykabel. Meist ist das Bild ruhig und schwarz, nur ein paar schwache Linien zittern.
// Dann verliert das Kabel kurz den Kontakt und das Bild reißt in waagerechten Störstreifen auf: bunte Datenzeilen,
// Blockfehler, Rauschen, Farbversatz, manchmal eine ganze gestörte Bildhälfte. Danach bleiben kurz einzelne Linien hängen.
const settings = { rate: 5, power: 6, split: 5, idle: 4, pal: 0 };
const controls = [
  { type: 'range', id: 'rate', label: 'Wackeln', min: 0, max: 10, fmt: v => v == 0 ? 'nur beim Entsperren' : lvl(v) },
  { type: 'range', id: 'power', label: 'Heftigkeit', min: 1, max: 10, fmt: lvl },
  { type: 'range', id: 'split', label: 'Farbversatz', min: 0, max: 10, fmt: lvl },
  { type: 'range', id: 'idle', label: 'Ruhe-Rauschen', min: 0, max: 10, fmt: lvl },
  { type: 'choice', id: 'pal', label: 'Störfarben', options: ['Bunt', 'Neon', 'Grün', 'Weiß'] },
];
const PALS = [
  [[255, 45, 200], [40, 230, 255], [255, 235, 60], [70, 255, 130], [245, 245, 255], [255, 60, 70], [80, 110, 255]],
  [[255, 45, 200], [40, 230, 255], [170, 90, 255], [255, 150, 240], [120, 255, 255]],
  [[60, 255, 120], [40, 255, 215], [190, 255, 200], [120, 255, 60], [30, 200, 140]],
  [[255, 255, 255], [200, 205, 215], [150, 155, 165], [235, 240, 255]],
];
const rgb = (c, b) => 'rgb(' + ((c[0] * (b == null ? 1 : b)) | 0) + ',' + ((c[1] * (b == null ? 1 : b)) | 0) + ',' + ((c[2] * (b == null ? 1 : b)) | 0) + ')';
const TW = 1024, TH = 384, NW = 256, NH = 96;

let W = 1, H = 1, dpr = 1, t = 0;
let tex = null, texC = null, noise = null;
let burst = null, after = -1, idle = [], stuck = [], roll = null, rollWait = 4;

// Streifen-Textur: jede Zeile eine Datenzeile mit Segmenten, Strichen oder Rauschen; dazu je eine Kopie pro Farbkanal
function genTextures() {
  const pal = PALS[settings.pal];
  const c = mk(TW, TH), x = c.getContext('2d'), img = x.createImageData(TW, TH), d = img.data, RW = TW * 4;
  const put = (p, col, b) => {
    const r = col[0] * b, g = col[1] * b, bb = col[2] * b;
    if (r > d[p]) d[p] = r; if (g > d[p + 1]) d[p + 1] = g; if (bb > d[p + 2]) d[p + 2] = bb;
  };
  for (let y = 0; y < TH; y++) {
    const o = y * RW;
    if (y > 0 && Math.random() < 0.3) { // Zeile davor leicht versetzt wiederholen: ergibt dickere Balken
      const sh = rint(-5, 5);
      for (let xx = 0; xx < TW; xx++) {
        const s = o - RW + (((xx + sh) % TW + TW) % TW) * 4, p = o + xx * 4;
        d[p] = d[s]; d[p + 1] = d[s + 1]; d[p + 2] = d[s + 2];
      }
      continue;
    }
    const r = Math.random();
    if (r < 0.44) continue;
    if (r < 0.8) {
      const n = rint(1, 5);
      for (let k = 0; k < n; k++) {
        const col = pick(pal), b = rnd(0.3, 1), x0 = rint(0, TW - 1), dash = Math.random() < 0.3 ? rint(2, 10) : 0;
        const len = Math.min(TW, 3 + Math.floor(-Math.log(1 - Math.random()) * 150));
        for (let i = 0; i < len; i++) { if (dash && ((i / dash) | 0) & 1) continue; put(o + ((x0 + i) % TW) * 4, col, b); }
      }
    } else if (r < 0.94) {
      const col = pick(pal), dens = rnd(0.1, 0.55), b0 = rnd(0.4, 1);
      for (let xx = 0; xx < TW; xx++) if (Math.random() < dens) put(o + xx * 4, Math.random() < 0.5 ? col : pick(pal), b0 * Math.random());
    } else {
      const col = pick(pal), b = rnd(0.45, 1);
      for (let xx = 0; xx < TW; xx++) put(o + xx * 4, col, b);
    }
  }
  for (let i = 3; i < d.length; i += 4) d[i] = 255;
  x.putImageData(img, 0, 0);
  tex = c;
  texC = [[255, 0, 0], [0, 255, 0], [0, 0, 255]].map(m => {
    const cc = mk(TW, TH), xc = cc.getContext('2d');
    xc.drawImage(c, 0, 0); xc.globalCompositeOperation = 'multiply'; xc.fillStyle = rgb(m); xc.fillRect(0, 0, TW, TH);
    return cc;
  });
  const nc = mk(NW, NH), nx = nc.getContext('2d'), ni = nx.createImageData(NW, NH), nd = ni.data;
  for (let i = 0; i < NW * NH; i++) {
    const v = Math.pow(Math.random(), 2.2), col = Math.random() < 0.6 ? [235, 240, 255] : pick(pal);
    nd[i * 4] = col[0] * v; nd[i * 4 + 1] = col[1] * v; nd[i * 4 + 2] = col[2] * v; nd[i * 4 + 3] = 255;
  }
  nx.putImageData(ni, 0, 0); noise = nc;
}

// Ruhige Linien zwischen den Störungen
function makeIdle() {
  const full = Math.random() < 0.45, len = full ? W : rnd(0.08, 0.6) * W;
  return {
    y: Math.round(rnd(0.02, 0.98) * H), x0: full ? 0 : rnd(0, W - len), len, col: rgb(pick(PALS[settings.pal])),
    a: rnd(0.3, 0.9), th: Math.random() < 0.3 ? 2 : 1, life: rnd(3, 14), age: 0, hold: 0, on: true, lv: 1,
  };
}
function syncIdle() {
  const n = Math.round(settings.idle * 0.7);
  while (idle.length > n) idle.pop();
  while (idle.length < n) { const l = makeIdle(); l.age = rnd(0, l.life * 0.8); idle.push(l); }
}
function drawIdle(ctx, dt) {
  const iv = settings.idle / 10;
  if (iv <= 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < idle.length; i++) {
    const l = idle[i];
    l.age += dt; if (l.age > l.life) { idle[i] = makeIdle(); continue; }
    l.hold -= dt; if (l.hold <= 0) { l.on = Math.random() < 0.82; l.lv = rnd(0.55, 1); l.hold = rnd(0.03, 0.7); }
    const fade = Math.min(1, l.age / 0.5, (l.life - l.age) / 0.5), a = l.a * (0.15 + 0.85 * iv) * fade * (l.on ? l.lv : 0.12);
    if (a < 0.004) continue;
    ctx.globalAlpha = a; ctx.fillStyle = l.col; ctx.fillRect(l.x0, l.y, l.len, l.th * Math.max(1, Math.round(dpr * 0.5)));
  }
  // ab und zu läuft ein schwaches Störband langsam durchs Bild
  if (!roll) { rollWait -= dt * (0.3 + iv); if (rollWait <= 0) roll = { y: 0, h: rnd(8, 40) * dpr, v: rnd(0.05, 0.16) * H, a: rnd(0.4, 1) }; }
  if (roll) {
    roll.y += roll.v * dt;
    if (roll.y > H + roll.h) { roll = null; rollWait = rnd(5, 16); }
    else {
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = 0.12 * iv * roll.a;
      ctx.drawImage(noise, rnd(0, NW * 0.6), rnd(0, NH - 12), NW * 0.4, 12, 0, roll.y - roll.h, W, roll.h);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// Eine Störung: was in diesem Moment (für ein paar Bilder) zu sehen ist
function makeLayout(P, first, flashOk) {
  const pal = PALS[settings.pal], L = { bands: [], blocks: [], flash: null, half: null, vy: 0 };
  const yc = rnd(0.08, 0.92) * H, spread = Math.random() < 0.35 ? H : rnd(0.1, 0.45) * H;
  const nb = Math.max(1, Math.round(rnd(0.4, 1) * (1 + P * 7))), maxCs = settings.split * 2.6 * dpr;
  for (let i = 0; i < nb; i++) {
    const h = Math.max(1, Math.round(rnd(1.5, 6 + 70 * P * P * rnd(0.3, 1)) * dpr));
    const k = Math.random() < 0.25 ? rnd(2, 6) : rnd(0.8, 1.3), tw = Math.min(TW, TW / k);
    L.bands.push({
      y: Math.round(clamp(yc + rnd(-0.5, 0.5) * spread, -h * 0.5, H - h * 0.5)), h, kind: Math.random() < 0.2 ? 1 : 0,
      sy: rint(0, TH - 2), sh: Math.max(1, Math.round(h / (dpr * rnd(0.7, 1.6)))),
      tx: rnd(0, TW - tw), tw, xo: Math.random() < 0.5 ? 0 : rnd(-0.22, 0.22) * W,
      cs: maxCs * rnd(0.3, 1) * (Math.random() < 0.5 ? -1 : 1), a: rnd(0.5, 1),
    });
  }
  if (Math.random() < 0.15 + 0.35 * P) { // Blockfehler wie bei kaputtem Videosignal
    const bs = Math.max(2, Math.round(rnd(6, 22) * dpr)), rows = rint(1, 3 + Math.round(P * 4));
    const y0 = Math.round(clamp(yc + rnd(-0.3, 0.3) * spread, 0, Math.max(0, H - bs * rows))), fill = rnd(0.15, 0.6);
    for (let r = 0; r < rows; r++) {
      const end = Math.random() < 0.5 ? W : rnd(0.4, 1) * W;
      for (let x = Math.random() < 0.5 ? 0 : rint(0, Math.round(W * 0.5)); x < end; x += bs)
        if (Math.random() < fill) L.blocks.push({ x, y: y0 + r * bs, s: bs, c: rgb(pick(pal), rnd(0.15, 0.9)) });
    }
  }
  if (Math.random() < 0.06 + 0.14 * P) { // untere oder obere Bildhälfte verliert den Takt
    const k = rnd(1, 3), tw = TW / k;
    L.half = { y: rnd(0.25, 0.8) * H, up: Math.random() < 0.3, sy: rint(0, Math.round(TH * 0.4)), tx: rnd(0, TW - tw), tw, a: rnd(0.3, 0.65), cs: maxCs * rnd(0.3, 1) };
  }
  if (flashOk && (first || Math.random() < 0.05 + 0.14 * P)) L.flash = { c: rgb(pick(pal)), a: first ? 0.26 : rnd(0.05, 0.1 + 0.16 * P) };
  if (Math.random() < 0.3) L.vy = rnd(-1, 1) * H * rnd(0.4, 2.5);
  return L;
}

function drawTex(ctx, sx, sy, sw, sh, x, y, w, h, cs) {
  if (Math.abs(cs) < 0.5) { ctx.drawImage(tex, sx, sy, sw, sh, x, y, w, h); return; }
  ctx.drawImage(texC[0], sx, sy, sw, sh, x + cs, y, w, h);
  ctx.drawImage(texC[1], sx, sy, sw, sh, x, y, w, h);
  ctx.drawImage(texC[2], sx, sy, sw, sh, x - cs, y, w, h);
}

function drawLayout(ctx, L, dt) {
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'lighter';
  if (L.flash) { ctx.globalAlpha = L.flash.a; ctx.fillStyle = L.flash.c; ctx.fillRect(0, 0, W, H); }
  if (L.half) {
    const hf = L.half, y0 = hf.up ? 0 : hf.y, hh = hf.up ? hf.y : H - hf.y, rows = Math.min(TH - hf.sy, Math.max(1, Math.round(hh / (dpr * 1.3))));
    if (Math.random() < 0.3) hf.sy = rint(0, Math.round(TH * 0.4));
    ctx.globalAlpha = hf.a * rnd(0.75, 1);
    drawTex(ctx, hf.tx, hf.sy, hf.tw, rows, rnd(-2, 2) * dpr, y0, W, hh, hf.cs);
  }
  for (const b of L.bands) {
    b.y += L.vy * dt;
    if (b.y > H) b.y -= H + b.h; else if (b.y < -b.h) b.y += H + b.h;
    if (Math.random() < 0.25) b.sy = (b.sy + rint(1, 3)) % (TH - 1);
    const x = b.xo + rnd(-1.5, 1.5) * dpr, sh = Math.max(1, Math.min(b.sh, TH - b.sy));
    ctx.globalAlpha = b.a;
    if (b.kind === 1) {
      const nh = Math.max(1, Math.min(NH - 1, Math.round(b.h / (dpr * 1.5))));
      ctx.drawImage(noise, rnd(0, NW * 0.7), rint(0, NH - nh), NW * 0.3, nh, x, b.y, W, b.h);
    } else drawTex(ctx, b.tx, b.sy, b.tw, sh, x, b.y, W, b.h, b.cs);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  for (const k of L.blocks) { ctx.fillStyle = k.c; ctx.fillRect(k.x, k.y, k.s, k.s); }
}

function startBurst(P, dur, first) { burst = { left: dur, P, hold: 0, L: null, on: false, first: !!first, flashes: 0 }; }
function endBurst() {
  const pal = PALS[settings.pal];
  if (Math.random() < 0.55) for (let k = rint(1, 2); k > 0; k--) {
    const full = Math.random() < 0.6, len = full ? W : rnd(0.2, 0.8) * W;
    stuck.push({ y: Math.round(rnd(0.03, 0.97) * H), x0: full ? 0 : rnd(0, W - len), len, col: rgb(pick(pal)), a: rnd(0.45, 0.9), life: rnd(1.2, 5), age: 0, th: rint(1, 2) * Math.max(1, Math.round(dpr * 0.5)) });
  }
  if (Math.random() < 0.45) after = rnd(0.12, 1.1);
}
function stepBurst(ctx, dt) {
  const b = burst;
  b.left -= dt; b.hold -= dt;
  if (b.hold <= 0) {
    b.on = b.first || Math.random() < 0.7;
    b.hold = b.on ? rnd(0.017, 0.14) : rnd(0.02, 0.16);
    if (b.on) { b.L = makeLayout(b.P * rnd(0.55, 1), b.first, b.flashes < 2); if (b.L.flash) b.flashes++; b.first = false; }
  }
  if (b.on && b.L) drawLayout(ctx, b.L, dt);
  if (b.left <= 0) { burst = null; endBurst(); }
}
function drawStuck(ctx, dt) {
  ctx.globalCompositeOperation = 'lighter';
  stuck = stuck.filter(s => {
    s.age += dt; if (s.age > s.life) return false;
    const a = s.a * Math.min(1, (s.life - s.age) / 0.8) * (Math.random() < 0.06 ? 0.2 : 1);
    ctx.globalAlpha = a; ctx.fillStyle = s.col; ctx.fillRect(s.x0, s.y, s.len, s.th);
    return true;
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
const powerNow = () => {
  let P = settings.power / 10 * rnd(0.6, 1);
  if (Math.random() < 0.12) P = Math.min(1, P + 0.35);
  return P;
};

return {
  maxDpr: 3,
  settings, controls,
  actionLabel: 'Wackeln',
  resize(w, h, d) { W = w; H = h; dpr = d; idle = []; stuck = []; syncIdle(); },
  newPattern() { genTextures(); idle = []; syncIdle(); stuck = []; },
  action() { const P = Math.min(1, settings.power / 10 + rnd(0, 0.3)); startBurst(P, rnd(0.3, 0.6) + P * rnd(0.1, 0.4), Math.random() < 0.5); after = -1; },
  wake() { startBurst(Math.min(1, settings.power / 10 + 0.25), rnd(0.45, 0.8), true); after = -1; },
  change(id) {
    if (id === 'pal') { genTextures(); idle = []; syncIdle(); }
    if (id === 'idle') syncIdle();
  },
  frame(ctx, dt) {
    t += dt;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    drawIdle(ctx, dt);
    if (!burst) {
      if (after > 0) { after -= dt; if (after <= 0) startBurst(powerNow() * rnd(0.4, 0.8), rnd(0.06, 0.3)); }
      else if (settings.rate > 0 && Math.random() < per(0.033 * Math.pow(45, (settings.rate - 1) / 9), dt)) {
        const P = powerNow(); startBurst(P, rnd(0.1, 0.3) + P * rnd(0.15, 0.8));
      }
    }
    if (burst) stepBurst(ctx, dt);
    drawStuck(ctx, dt);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};

})();

// ---------- Rahmen: Leinwand, Einstellungen, Bedienung ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const S = E.settings, KEY = 'nw-wackelkontakt';
try { const sv = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in sv) if (k in S && typeof sv[k] === typeof S[k]) S[k] = sv[k]; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, E.maxDpr || 3);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h; cv.width = W; cv.height = H;
  E.resize(W, H, dpr);
}

// Regler und Auswahlknöpfe aus der Beschreibung des Effekts bauen
const box = document.getElementById('controls'), ui = {};
// Wert setzen und Anzeige nachziehen (auch für den Effekt selbst, z. B. automatische Schriftwahl)
const setVal = (id, v) => { S[id] = v; if (ui[id]) ui[id](v); save(); };
for (const c of E.controls) {
  const row = document.createElement('div'); row.className = 'row';
  if (c.type === 'range') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + ' <output></output></label>' +
      '<input id="' + c.id + '" type="range" min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '">';
    box.appendChild(row);
    const el = row.querySelector('input'), out = row.querySelector('output'), fmt = c.fmt || String;
    ui[c.id] = v => { el.value = v; out.textContent = fmt(+v); };
    ui[c.id](S[c.id]);
    el.addEventListener('input', () => { S[c.id] = +el.value; out.textContent = fmt(S[c.id]); save(); if (E.change) E.change(c.id); });
  } else if (c.type === 'choice' || c.type === 'grid') {
    // 'grid': viele Möglichkeiten in zwei Spalten, mit Zwischenüberschriften und eigener Schrift je Knopf
    row.innerHTML = '<span class="lbl">' + c.label + '</span><div class="' + (c.type === 'grid' ? 'grid' : 'seg') + '"></div>';
    box.appendChild(row);
    const wrap = row.querySelector('.grid, .seg'), btns = [];
    let group = null;
    c.options.forEach((o, i) => {
      if (o.group && o.group !== group) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = o.group; wrap.appendChild(h); group = o.group; }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = typeof o === 'string' ? o : o.label;
      if (o.font) b.style.fontFamily = o.font;
      if (o.weight) b.style.fontWeight = o.weight;
      b.addEventListener('click', () => { setVal(c.id, i); if (E.change) E.change(c.id); });
      wrap.appendChild(b); btns.push(b);
    });
    ui[c.id] = v => btns.forEach((b, j) => b.classList.toggle('on', j === v));
    ui[c.id](S[c.id]);
  } else if (c.type === 'text') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + '</label>' +
      '<input id="' + c.id + '" type="text" maxlength="' + (c.max || 20) + '" autocomplete="off" spellcheck="false">';
    box.appendChild(row);
    const el = row.querySelector('input'); el.value = S[c.id];
    ui[c.id] = v => { el.value = v; };
    el.addEventListener('input', () => { S[c.id] = el.value; save(); if (E.change) E.change(c.id); });
  }
}
if (E.bindUI) E.bindUI({ set: setVal });
document.getElementById('actBtn').textContent = E.actionLabel;
document.getElementById('newBtn').onclick = () => E.newPattern();
document.getElementById('actBtn').onclick = () => E.action();
document.getElementById('closeBtn').onclick = () => { sheet.hidden = true; };
cv.addEventListener('click', () => { sheet.hidden = !sheet.hidden; hint.classList.add('gone'); });
setTimeout(() => hint.classList.add('gone'), 3500);

// Vollbild: immer echtes Vollbild versuchen; wenn die Ansicht es sperrt, bleibt die Leinwand ohne Bedienelemente
const fsBtn = document.getElementById('fsBtn');
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let toastTimer = 0;
function toast(msg) {
  hint.textContent = msg; hint.classList.add('msg'); hint.classList.remove('gone');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => hint.classList.add('gone'), 4000);
}
const fsBlocked = () => { if (!isFs()) toast('In dieser Ansicht ist Vollbild gesperrt. Öffne die Vorschau-Karte, dort geht es. Antippen holt die Einstellungen zurück.'); };
fsBtn.onclick = () => {
  sheet.hidden = true;
  try {
    if (isFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { fsBlocked(); return; }
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.then) r.then(() => setTimeout(fsBlocked, 300), fsBlocked); else setTimeout(fsBlocked, 500);
  } catch (e) { fsBlocked(); }
};
const fsLabel = () => { fsBtn.textContent = isFs() ? 'Vollbild beenden' : 'Vollbild'; };
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);

// Start
addEventListener('resize', resize);
resize();
E.newPattern();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  E.frame(ctx, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// So tun, als würde das Handy entsperrt: beim Öffnen und wenn die Seite wieder sichtbar wird
setTimeout(() => E.wake(), 450);
document.addEventListener('visibilitychange', () => { if (!document.hidden) E.wake(); });
window.__nw = { E, S };
})();
</script>
