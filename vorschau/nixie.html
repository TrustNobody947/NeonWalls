<title>Nixie-Uhr</title>
<style>
/* Layout: one full-screen canvas, single dark look; tapping the canvas reveals a control sheet */
:root{
  --bg:#000;
  --panel:rgba(12,14,18,.9);
  --fg:#e8ecf2;
  --muted:#8a93a3;
  --accent:#ff8a2a;
  --line:rgba(255,255,255,.12);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
:root{padding:0!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;
  background:var(--panel);padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  transition:opacity .6s;pointer-events:none;white-space:nowrap;z-index:5}
.hint.msg{white-space:normal;text-transform:none;letter-spacing:0;font:500 13px/1.45 var(--font);color:var(--fg);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;border-radius:14px}
.hint.gone{opacity:0}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;
  font:14px/1.4 var(--font);display:grid;gap:14px;backdrop-filter:blur(8px)}
.sheet h2{margin:0;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
#controls{display:grid;gap:14px}
.row{display:grid;gap:6px}
.row label,.row .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.row output{font:12px var(--mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row input[type=text]{width:100%;box-sizing:border-box;font:600 15px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:13px}
.seg button.on{background:var(--accent);color:#000;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid .grp{grid-column:1/-1;margin-top:6px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid button{min-width:0;padding:10px 8px;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.on{background:var(--accent);color:#000;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 auto;font:600 14px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#000;border-color:transparent}
</style>

<canvas id="c" aria-label="Animierter Hintergrund: Uhr aus Nixie-Röhren mit der aktuellen Uhrzeit"></canvas>
<div class="hint" id="hint">Tippen für Einstellungen</div>

<div class="sheet" id="sheet" hidden>
  <h2>Nixie-Uhr</h2>
  <p class="sub">Die echte Uhrzeit in glühenden Ziffernröhren.</p>
  <div id="controls"></div>
  <div class="btns">
    <button id="newBtn" class="primary" type="button">Neues Muster</button>
    <button id="actBtn" type="button">Effekt</button>
    <button id="fsBtn" type="button">Vollbild</button>
    <button id="closeBtn" type="button">Schließen</button>
  </div>
</div>

<script>
(() => {
'use strict';
// Hilfsfunktionen für alle Effekte
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lvl = v => v == 0 ? 'aus' : v < 4 ? 'leicht' : v < 7 ? 'mittel' : 'stark';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
// Wahrscheinlichkeit für "rate mal pro Sekunde" bei Zeitschritt dt
const per = (rate, dt) => 1 - Math.exp(-rate * dt);

// ---------- Effekt ----------
const E = (function () {
// Nixie-Uhr: die echte Uhrzeit in Ziffernröhren, möglichst fotorealistisch.
// Jede Röhre: Glaskolben mit Pumpspitze oben, Getterspiegel in der Kuppel, Glimmerscheiben oben und unten, Haltestäbe,
// Zuleitungen im Fuß. Innen stehen die zehn Drahtziffern hintereinander (Reihenfolge wie bei der IN-14). Die leuchtende Ziffer
// wird von den Drähten davor teilweise verdeckt, vorne liegt das gewölbte Wabengitter. Das Glühen spiegelt sich im Glas,
// auf den Glimmerscheiben und auf der glänzenden Fläche, auf der die Röhren stehen.
// Beim Entsperren, zur vollen Stunde und auf Knopfdruck laufen die Ziffern wie ein Spielautomat durch.
// Damit es wie gefilmt wirkt: dunkler Raum mit unscharfen Lichtern weit hinten, Staub auf dem Glas, Spiegelbild der Ziffer
// in der gewölbten Glaswand, weiche Spiegelung auf dem Tisch und ein Kamera-Look (Lichthof, Körnung, Randabdunklung,
// ganz leichtes Wackeln).
// Kamera-Look (wird in mehrere Effekte eingebunden): Lichthof um helle Stellen, Körnung wie bei Video bei wenig Licht,
// Randabdunklung und ein ganz leichtes Wackeln wie aus der Hand gefilmt.
function makeCamera() {
  let W = 1, H = 1, b1 = null, b2 = null, x1 = null, x2 = null, grainC = null, pat = null, patCtx = null, vig = null, vigA = -1;
  function genGrain() {
    const n = 256, c = mk(n, n), x = c.getContext('2d'), img = x.createImageData(n, n), d = img.data;
    for (let i = 0; i < n * n; i++) {
      const v = Math.random(), g = v * v * 255, tint = Math.random();
      d[i * 4] = g * (0.9 + 0.2 * tint); d[i * 4 + 1] = g; d[i * 4 + 2] = g * (1.1 - 0.2 * tint); d[i * 4 + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  return {
    resize(w, h) {
      W = w; H = h;
      b1 = mk(Math.max(1, w >> 2), Math.max(1, h >> 2)); x1 = b1.getContext('2d');
      b2 = mk(Math.max(1, w >> 3), Math.max(1, h >> 3)); x2 = b2.getContext('2d');
      if (!grainC) grainC = genGrain();
      pat = null; vig = null;
    },
    // kleine Verschiebung wie bei einer Handkamera (in Gerätepixeln)
    shake(t, amount, dpr) {
      const a = amount * dpr;
      return [a * (Math.sin(t * 0.71) * 0.8 + Math.sin(t * 1.93 + 1) * 0.35), a * (Math.sin(t * 0.53 + 2) * 0.7 + Math.sin(t * 2.31) * 0.3)];
    },
    // Lichthof: verkleinerte, dadurch weiche Kopie des Bilds dazuaddieren. Die Kopie wird vorher mit sich selbst
    // multipliziert (Helligkeit hoch 2 bzw. hoch 4), damit nur helle Stellen strahlen und das Dunkle nicht milchig wird.
    bloom(ctx, strength, sharp) {
      if (!b1 || strength <= 0) return;
      x1.globalCompositeOperation = 'copy'; x1.imageSmoothingEnabled = true; x1.drawImage(ctx.canvas, 0, 0, b1.width, b1.height);
      x1.globalCompositeOperation = 'multiply';
      for (let i = 0; i < (sharp == null ? 1 : sharp); i++) x1.drawImage(b1, 0, 0);
      x2.globalCompositeOperation = 'copy'; x2.imageSmoothingEnabled = true; x2.drawImage(b1, 0, 0, b2.width, b2.height);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
      ctx.globalAlpha = Math.min(1, strength * 0.5); ctx.drawImage(b1, 0, 0, W, H);
      ctx.globalAlpha = Math.min(1, strength); ctx.drawImage(b2, 0, 0, W, H);
      ctx.restore();
    },
    vignette(ctx, amount) {
      if (amount <= 0) return;
      if (!vig || vigA !== amount) {
        vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,' + amount + ')'); vigA = amount;
      }
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H); ctx.restore();
    },
    // Körnung: bei jedem Bild an anderer Stelle, damit sie lebt
    grain(ctx, amount, dpr) {
      if (amount <= 0 || !grainC) return;
      if (!pat || patCtx !== ctx) { pat = ctx.createPattern(grainC, 'repeat'); patCtx = ctx; }
      const s = Math.max(1, dpr * 0.75);
      ctx.save(); ctx.setTransform(s, 0, 0, s, -Math.random() * 256 * s, -Math.random() * 256 * s);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = amount;
      ctx.fillStyle = pat; ctx.fillRect(0, 0, W / s + 256, H / s + 256);
      ctx.restore();
    },
  };
}

const settings = { mode: 0, arrange: 0, pos: 1, color: 0, glow: 6, flicker: 3, mirror: 0, room: 0, video: 0 };
const controls = [
  { type: 'choice', id: 'mode', label: 'Anzeige', options: ['Uhrzeit', 'Mit Sekunden'] },
  { type: 'choice', id: 'arrange', label: 'Anordnung', options: ['Gestapelt', 'In einer Reihe'] },
  { type: 'choice', id: 'pos', label: 'Position', options: ['Oben', 'Mitte', 'Unten'] },
  { type: 'choice', id: 'color', label: 'Farbe', options: ['Orange', 'Eisblau', 'Grün', 'Pink'] },
  { type: 'range', id: 'glow', label: 'Glühen', min: 1, max: 10, fmt: lvl },
  { type: 'range', id: 'flicker', label: 'Flackern', min: 0, max: 10, fmt: lvl },
  { type: 'choice', id: 'mirror', label: 'Spiegelung', options: ['An', 'Aus'] },
  { type: 'choice', id: 'room', label: 'Umgebung', options: ['Dunkler Raum', 'Schwarz'] },
  { type: 'choice', id: 'video', label: 'Kamera-Look', options: ['An', 'Aus'] },
];
const cam = makeCamera();
const COLORS = [
  { core: [255, 236, 200], hot: [255, 196, 96], glow: [255, 124, 30], outer: [255, 70, 8] },
  { core: [230, 248, 255], hot: [150, 215, 255], glow: [80, 175, 255], outer: [40, 105, 255] },
  { core: [230, 255, 236], hot: [150, 255, 180], glow: [60, 245, 120], outer: [20, 190, 80] },
  { core: [255, 230, 248], hot: [255, 150, 225], glow: [255, 80, 200], outer: [220, 30, 150] },
];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
const TAU = Math.PI * 2, PI = Math.PI;
const RATIO = 2.1, TILT = 0.12;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
// Ziffern aus Draht, in einem Kasten von 0,6 x 1 (y nach unten)
const DIG = [
  [['M', 0.57, 0.5], ['E', 0.3, 0.5, 0.27, 0.47, 0, TAU]],
  [['M', 0.17, 0.15], ['L', 0.31, 0.02], ['L', 0.31, 0.98]],
  [['M', 0.05, 0.25], ['A', 0.3, 0.26, 0.25, PI + 0.06, TAU + 0.55], ['Q', 0.34, 0.66, 0.03, 0.98], ['L', 0.59, 0.98]],
  [['M', 0.094, 0.16], ['A', 0.3, 0.26, 0.23, PI + 0.45, TAU + PI / 2], ['A', 0.3, 0.735, 0.245, -PI / 2, PI - 0.4]],
  [['M', 0.47, 0.98], ['L', 0.47, 0.02], ['L', 0.02, 0.68], ['L', 0.6, 0.68]],
  [['M', 0.56, 0.02], ['L', 0.1, 0.02], ['L', 0.07, 0.46], ['A', 0.3, 0.7, 0.26, -2.45, 2.55]],
  [['M', 0.52, 0.04], ['Q', 0.1, 0.2, 0.035, 0.66], ['M', 0.57, 0.705], ['A', 0.3, 0.705, 0.27, 0, TAU]],
  [['M', 0.02, 0.02], ['L', 0.58, 0.02], ['Q', 0.3, 0.45, 0.2, 0.98]],
  [['M', 0.52, 0.255], ['A', 0.3, 0.255, 0.22, 0, TAU], ['M', 0.56, 0.725], ['A', 0.3, 0.725, 0.26, 0, TAU]],
  [['M', 0.57, 0.295], ['A', 0.3, 0.295, 0.27, 0, TAU], ['M', 0.57, 0.31], ['Q', 0.52, 0.8, 0.08, 0.96]],
];
// Lage im Ziffernstapel wie bei der IN-14, von vorne nach hinten: 1 6 2 7 5 0 4 9 8 3
const DEPTH = [5, 0, 2, 9, 6, 4, 1, 3, 8, 7];
function digitPath(x, d, x0, y0, s) {
  x.beginPath();
  for (const c of DIG[d]) {
    if (c[0] === 'M') x.moveTo(x0 + c[1] * s, y0 + c[2] * s);
    else if (c[0] === 'L') x.lineTo(x0 + c[1] * s, y0 + c[2] * s);
    else if (c[0] === 'Q') x.quadraticCurveTo(x0 + c[1] * s, y0 + c[2] * s, x0 + c[3] * s, y0 + c[4] * s);
    else if (c[0] === 'A') x.ellipse(x0 + c[1] * s, y0 + c[2] * s, c[3] * s, c[3] * s, 0, c[4], c[5]);
    else if (c[0] === 'E') x.ellipse(x0 + c[1] * s, y0 + c[2] * s, c[3] * s, c[4] * s, 0, c[5], c[6]);
  }
}

let W = 1, H = 1, dpr = 1, t = 0;
let tubes = [], rows = [], seps = [], st = [], lit = [], occ = [], tangle = null, back = null, front = null, inner = null, halo = null, dot = null;
let tw = 1, th = 1, dh = 1, pad = 1, m = 1, tipH = 1, mb = 1, lastMin = -1, lastHour = -1, sepOff = 0, aging = [], weak = -1, refl = null, rx = null;
let bg = null, bgM = 0, bokeh = [], dust = [], speck = null, lean = [], pool = null;
const RS = 3; // Tischspiegelung in einem Drittel der Auflösung: wird beim Hochskalieren weich wie auf echtem Lack

function layout() {
  const n = settings.mode ? 6 : 4;
  tubes = []; seps = []; rows = [];
  const cyF = [0.3, 0.5, 0.68][settings.pos];
  if (settings.arrange === 0) {
    const R = n / 2, avail = H * (R === 2 ? 0.62 : 0.8), sepG = Math.min(W, H) * 0.09;
    th = (avail - (R - 1) * sepG) / R; tw = Math.min(th / RATIO, W * 0.33); th = tw * RATIO;
    const gapX = tw * 0.14, blockH = R * th + (R - 1) * sepG;
    const y0 = clamp(cyF * H - blockH / 2, H * 0.06, Math.max(H * 0.06, H * 0.95 - blockH));
    for (let r = 0; r < R; r++) {
      const y = y0 + r * (th + sepG);
      tubes.push({ x: W / 2 - gapX / 2 - tw, y }, { x: W / 2 + gapX / 2, y });
      rows.push({ x0: W / 2 - gapX / 2 - tw * 1.6, x1: W / 2 + gapX / 2 + tw * 1.6, top: y, bottom: y + th, room: r < R - 1 ? sepG * 0.8 : H - (y + th) });
      if (r < R - 1) seps.push({ x: W / 2, y: y + th + sepG * 0.55, horiz: true });
    }
  } else {
    const nsep = n / 2 - 1, gap = 0.1, sepW = 0.42;
    tw = Math.min(W * 0.94 / (n + (n - 1) * gap + nsep * sepW), H * 0.5 / RATIO); th = tw * RATIO;
    const total = tw * (n + (n - 1) * gap + nsep * sepW);
    const y = clamp(cyF * H - th / 2, H * 0.06, H * 0.95 - th);
    let x = (W - total) / 2;
    for (let i = 0; i < n; i++) {
      tubes.push({ x, y }); x += tw;
      if (i < n - 1) {
        if (i % 2 === 1) { seps.push({ x: x + tw * (gap + sepW / 2), y: y + th * 0.415, horiz: false }); x += tw * (sepW + gap * 2); }
        else x += tw * gap;
      }
    }
    rows.push({ x0: (W - total) / 2 - tw * 0.6, x1: (W + total) / 2 + tw * 0.6, top: y, bottom: y + th, room: H - (y + th) });
  }
  dh = th * 0.44;
  m = Math.ceil(tw * 0.1 + 4); tipH = Math.ceil(tw * 0.08); mb = Math.ceil(th * 0.14);
  refl = mk(Math.ceil(W / RS) + 2, Math.ceil(th * 0.45 / RS) + 2); rx = refl.getContext('2d');
}

// Raum hinter den Röhren in halber Auflösung (ist ohnehin unscharf): dunkle Wand, vom Glühen schwach angestrahlt,
// unscharfe Lichter weit hinten und vorne die Tischfläche, auf der die Röhren stehen.
function newRoom() {
  // Lichter weit hinten im Raum (Lichterkette, Standby-Lämpchen, Fenster gegenüber), meist warm, selten kühl
  bokeh = [];
  const n = rint(6, 9), band = rnd(0.25, 0.6);
  for (let i = 0; i < n; i++) {
    const warm = Math.random() < 0.75, near = Math.random() < 0.25;
    bokeh.push({ u: rnd(-0.05, 1.05), v: clamp(band + rnd(-0.22, 0.22), 0.04, 0.92), r: near ? rnd(0.05, 0.075) : rnd(0.018, 0.04),
      a: near ? rnd(0.05, 0.08) : rnd(0.1, 0.2), c: warm ? [255, rint(130, 190), rint(50, 110)] : [rint(70, 130), rint(150, 200), 255] });
  }
  dust = [];
  for (let i = 0; i < 6; i++) {
    const L = [], k = rint(4, 9);
    for (let j = 0; j < k; j++) L.push([rnd(0.06, 0.94), rnd(0.03, 0.97), rnd(0.5, 1.5), rnd(0.35, 1)]);
    dust.push(L);
  }
}
function genBg() {
  bg = null;
  if (settings.room !== 0 || !rows.length) return;
  const C = COLORS[settings.color], s = 0.5;
  bgM = Math.ceil(6 * dpr);
  const bw = Math.ceil((W + 2 * bgM) * s), bh = Math.ceil((H + 2 * bgM) * s);
  bg = mk(bw, bh);
  const x = bg.getContext('2d');
  x.scale(s, s); x.translate(bgM, bgM); // ab hier in Bildschirmkoordinaten
  const last = rows[rows.length - 1], floor = last.bottom, horizon = floor - th * 0.05;
  const cx = W / 2, cy = (rows[0].top + floor) / 2, big = Math.max(W, H);
  x.fillStyle = '#030303'; x.fillRect(-bgM, -bgM, W + 2 * bgM, H + 2 * bgM);
  // Wand: das Glühen fällt warm auf die Wand direkt hinter den Röhren
  let g = x.createRadialGradient(cx, cy, 0, cx, cy, big * 0.5);
  g.addColorStop(0, rgba(C.outer, 0.08)); g.addColorStop(0.4, rgba(C.outer, 0.025)); g.addColorStop(1, rgba(C.outer, 0));
  x.fillStyle = g; x.fillRect(-bgM, -bgM, W + 2 * bgM, horizon + bgM);
  // Lichter weit hinten: runde, unscharfe Scheiben mit etwas hellerem Rand wie bei einem echten Objektiv
  x.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    const bx = b.u * W, by = b.v * horizon, r = b.r * Math.min(W, H) * 1.6;
    const bg2 = x.createRadialGradient(bx, by, 0, bx, by, r);
    bg2.addColorStop(0, rgba(b.c, b.a * 0.6)); bg2.addColorStop(0.75, rgba(b.c, b.a * 0.78));
    bg2.addColorStop(0.9, rgba(b.c, b.a)); bg2.addColorStop(1, rgba(b.c, 0));
    x.fillStyle = bg2; x.beginPath(); x.arc(bx, by, r, 0, TAU); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
  // Tisch: Kante hinter den Röhren, Lack glänzt dort flach im Gegenlicht und wird nach vorne dunkel
  g = x.createLinearGradient(0, horizon, 0, H + bgM);
  g.addColorStop(0, 'rgb(14,12,11)'); g.addColorStop(0.03, 'rgb(7,6,6)'); g.addColorStop(1, 'rgb(1,1,1)');
  x.fillStyle = g; x.fillRect(-bgM, horizon, W + 2 * bgM, H + bgM - horizon);
  g = x.createRadialGradient(cx, floor, 0, cx, floor, big * 0.45);
  g.addColorStop(0, rgba(C.outer, 0.12)); g.addColorStop(0.5, rgba(C.outer, 0.03)); g.addColorStop(1, rgba(C.outer, 0));
  x.save(); x.beginPath(); x.rect(-bgM, horizon, W + 2 * bgM, H + bgM - horizon); x.clip();
  x.translate(cx, floor); x.scale(1, 0.35); x.translate(-cx, -floor);
  x.fillStyle = g; x.fillRect(-bgM, floor - big * 0.45, W + 2 * bgM, big * 0.9);
  x.restore();
  // feine Lichtkante an der Tischkante
  g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, rgba(C.hot, 0.07)); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(-bgM, horizon, W + 2 * bgM, Math.max(1, dpr * 0.8));
}
const digitX = tb => tb.x + tw / 2 - dh * 0.3, digitY = tb => tb.y + th * 0.195;
// Lage einer Ziffer im Stapel: hintere etwas kleiner und (Blick leicht von oben) etwas höher

return {

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (bg) { ctx.imageSmoothingEnabled = true; ctx.setTransform(1, 0, 0, 1, ox, oy); ctx.drawImage(bg, -bgM, -bgM, W + 2 * bgM, H + 2 * bgM); }
    else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.setTransform(1, 0, 0, 1, ox, oy); }
    sepOff = Math.max(0, sepOff - dt);
    let ri = 0;
    for (let i = 0; i < n; i++) {
      const s = st[i], tb = tubes[i];
      if (!tb) continue;
      if (t < s.cyc) { s.step -= dt; if (s.step <= 0) { setDigit(s, (s.cur + 1) % 10, true); s.step = 0.05; } }
      else if (s.cur !== T.arr[i]) setDigit(s, T.arr[i], false);
      s.fade = Math.min(1, s.fade + dt / s.fd);
      // Flackern: feines Zittern, kurze Aussetzer und ab und zu eine falsch mitglimmende Ziffer
      const wk = i === weak ? 3.5 : 1;
      if (s.drop > 0) s.drop -= dt; else if (fl > 0 && Math.random() < per(fl * 0.06 * wk, dt)) { s.drop = rnd(0.03, 0.22); s.dropLv = rnd(0.12, 0.7); }
      if (s.gT > 0) s.gT -= dt; else if (fl > 0 && Math.random() < per(fl * 0.035 * wk, dt)) { s.ghost = (s.cur + rint(1, 9)) % 10; s.gT = rnd(0.05, 0.3); s.gLv = rnd(0.1, 0.35); }
      const bri = Math.min(1, aging[i] * (1 - fl * 0.07 * Math.random()) * (s.drop > 0 ? s.dropLv : 1));
      const px = digitX(tb) - pad, py = digitY(tb) - pad, sx = tb.x - m, sy = tb.y - m - tipH;
      // Röhre um ihren Fußpunkt minimal geneigt zeichnen
      const la = lean[i] || 0, ca = Math.cos(la), sa = Math.sin(la), fx0 = tb.x + tw / 2, fy0 = tb.y + th;
      ctx.setTransform(ca, sa, -sa, ca, ox + fx0 - (ca * fx0 - sa * fy0), oy + fy0 - (sa * fx0 + ca * fy0));
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = bri;
      ctx.drawImage(halo, tb.x + tw / 2 - halo.width / 2, tb.y + th * 0.415 - halo.height / 2);
      ctx.drawImage(pool, fx0 - pool.width / 2, fy0 - pool.height / 2);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.drawImage(back, sx, sy);
      ctx.drawImage(tangle, px, py);
      ctx.globalCompositeOperation = 'lighter';
      const e = s.fade * s.fade * (3 - 2 * s.fade);
      if (e < 1) { ctx.globalAlpha = bri * (1 - e); ctx.drawImage(lit[s.prev], px, py); }
      ctx.globalAlpha = bri * e; ctx.drawImage(lit[s.cur], px, py);
      if (s.gT > 0 && s.ghost !== s.cur) { ctx.globalAlpha = s.gLv * bri; ctx.drawImage(lit[s.ghost], px, py); }
      // Spiegelbild der Ziffer in der gewölbten Glaswand links und rechts: schmal gestaucht und seitenverkehrt
      const lw = lit[s.cur].width;
      for (const [xr, k, a] of [[0.075, 0.13, 0.15], [0.93, 0.1, 0.1]]) {
        ctx.save(); ctx.translate(tb.x + tw * xr, 0); ctx.scale(-k, 1);
        ctx.globalAlpha = bri * e * a; ctx.drawImage(lit[s.cur], -lw / 2, py);
        if (e < 1) { ctx.globalAlpha = bri * (1 - e) * a; ctx.drawImage(lit[s.prev], -lw / 2, py); }
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (occ[s.cur]) { ctx.globalAlpha = 0.4 + 0.6 * bri; ctx.drawImage(occ[s.cur], px, py); }
      ctx.globalAlpha = 1;
      ctx.drawImage(front, sx, sy);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = bri;
      ctx.drawImage(inner, sx, sy);
      // Staub auf dem Glas leuchtet dort auf, wo das Licht der Ziffer hinkommt
      const L = dust[i % dust.length];
      if (L && speck) {
        for (const d of L) {
          const du = (d[0] - 0.5) * 1.6, dv = (d[1] - 0.42) * 1.25, near = Math.exp(-(du * du + dv * dv) * 3.2);
          const sz = d[2] * dpr * 2.2;
          ctx.globalAlpha = d[3] * (0.05 + 0.4 * near * bri);
          ctx.drawImage(speck, tb.x + d[0] * tw - sz / 2, tb.y + d[1] * th - sz / 2, sz, sz);
        }
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, ox, oy);
      // Spiegelung, sobald eine Reihe fertig ist
      const row = rows[ri];
      if (row && (i === n - 1 || (tubes[i + 1] && tubes[i + 1].y !== tb.y))) {
        if (settings.mirror === 0) {
          const rh = Math.max(1, Math.min(th * 0.42, row.room)), x0 = Math.max(0, row.x0), w = Math.min(W, row.x1) - x0, fy = row.bottom;
          const hh = Math.floor(Math.min(rh, H - fy, (refl.height - 2) * RS));
          if (w > RS * 2 && hh > RS * 2) {
            // Ausschnitt über der Fläche verkleinert und gespiegelt kopieren, nach unten ausblenden und weich dazuaddieren
            const lx = x0 / RS, lw2 = w / RS, lh = hh / RS, srcX = clamp(x0 + ox, 0, W - w), srcY = clamp(fy - hh + oy, 0, H - hh);
            rx.save(); rx.globalCompositeOperation = 'copy'; rx.globalAlpha = 1; rx.imageSmoothingEnabled = true;
            rx.translate(0, lh); rx.scale(1, -1);
            rx.drawImage(ctx.canvas, srcX, srcY, w, hh, lx, 0, lw2, lh);
            rx.restore();
            rx.globalCompositeOperation = 'destination-in';
            const fg = rx.createLinearGradient(0, 0, 0, lh);
            fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(0.35, 'rgba(0,0,0,0.45)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
            rx.fillStyle = fg; rx.fillRect(lx, 0, lw2, lh);
            const sg = rx.createLinearGradient(lx, 0, lx + lw2, 0);
            sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(0.18, 'rgba(0,0,0,1)'); sg.addColorStop(0.82, 'rgba(0,0,0,1)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
            rx.fillStyle = sg; rx.fillRect(lx, 0, lw2, lh);
            rx.globalCompositeOperation = 'source-over';
            ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3; ctx.imageSmoothingEnabled = true;
            ctx.drawImage(refl, lx, 0, lw2, lh, x0, fy, w, hh);
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
          }
        }
        ri++;
      }
    }
    // Trennpunkte blinken im Sekundentakt
    const on = sepOff > 0 ? 0 : clamp(Math.min(T.ms / 60, (520 - T.ms) / 80), 0, 1);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = on;
    const D = dot.width / 2, off = tw * 0.13;
    for (const sp of seps) {
      if (sp.horiz) { ctx.drawImage(dot, sp.x - off - D, sp.y - D); ctx.drawImage(dot, sp.x + off - D, sp.y - D); }
      else { ctx.drawImage(dot, sp.x - D, sp.y - off * 1.4 - D); ctx.drawImage(dot, sp.x - D, sp.y + off * 1.4 - D); }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // Kamera-Look: Lichthof um das Glühen, Randabdunklung, Körnung wie bei Video im Dunkeln
    if (vid) {
      cam.bloom(ctx, 0.45, 1);
      cam.vignette(ctx, 0.55);
      cam.grain(ctx, 0.04, dpr);
    }
  },
};

})();

// ---------- Rahmen: Leinwand, Einstellungen, Bedienung ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const S = E.settings, KEY = 'nw-nixie';
try { const sv = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in sv) if (k in S && typeof sv[k] === typeof S[k]) S[k] = sv[k]; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, E.maxDpr || 3);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h; cv.width = W; cv.height = H;
  E.resize(W, H, dpr);
}

// Regler und Auswahlknöpfe aus der Beschreibung des Effekts bauen
const box = document.getElementById('controls'), ui = {};
// Wert setzen und Anzeige nachziehen (auch für den Effekt selbst, z. B. automatische Schriftwahl)
const setVal = (id, v) => { S[id] = v; if (ui[id]) ui[id](v); save(); };
for (const c of E.controls) {
  const row = document.createElement('div'); row.className = 'row';
  if (c.type === 'range') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + ' <output></output></label>' +
      '<input id="' + c.id + '" type="range" min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '">';
    box.appendChild(row);
    const el = row.querySelector('input'), out = row.querySelector('output'), fmt = c.fmt || String;
    ui[c.id] = v => { el.value = v; out.textContent = fmt(+v); };
    ui[c.id](S[c.id]);
    el.addEventListener('input', () => { S[c.id] = +el.value; out.textContent = fmt(S[c.id]); save(); if (E.change) E.change(c.id); });
  } else if (c.type === 'choice' || c.type === 'grid') {
    // 'grid': viele Möglichkeiten in zwei Spalten, mit Zwischenüberschriften und eigener Schrift je Knopf
    row.innerHTML = '<span class="lbl">' + c.label + '</span><div class="' + (c.type === 'grid' ? 'grid' : 'seg') + '"></div>';
    box.appendChild(row);
    const wrap = row.querySelector('.grid, .seg'), btns = [];
    let group = null;
    c.options.forEach((o, i) => {
      if (o.group && o.group !== group) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = o.group; wrap.appendChild(h); group = o.group; }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = typeof o === 'string' ? o : o.label;
      if (o.font) b.style.fontFamily = o.font;
      if (o.weight) b.style.fontWeight = o.weight;
      b.addEventListener('click', () => { setVal(c.id, i); if (E.change) E.change(c.id); });
      wrap.appendChild(b); btns.push(b);
    });
    ui[c.id] = v => btns.forEach((b, j) => b.classList.toggle('on', j === v));
    ui[c.id](S[c.id]);
  } else if (c.type === 'text') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + '</label>' +
      '<input id="' + c.id + '" type="text" maxlength="' + (c.max || 20) + '" autocomplete="off" spellcheck="false">';
    box.appendChild(row);
    const el = row.querySelector('input'); el.value = S[c.id];
    ui[c.id] = v => { el.value = v; };
    el.addEventListener('input', () => { S[c.id] = el.value; save(); if (E.change) E.change(c.id); });
  }
}
if (E.bindUI) E.bindUI({ set: setVal });
if (E.hint) hint.textContent = E.hint;
document.getElementById('actBtn').textContent = E.actionLabel;
document.getElementById('newBtn').onclick = () => E.newPattern();
document.getElementById('actBtn').onclick = () => E.action();
document.getElementById('closeBtn').onclick = () => { sheet.hidden = true; };
// Berührung: Effekte mit E.touch bekommen Finger-Positionen (Gerätepixel). Kurzes Tippen ohne Bewegen
// öffnet weiterhin die Einstellungen, Wischen oder langes Halten nicht.
let dragged = false, downX = 0, downY = 0, downT = 0;
if (E.touch) {
  cv.style.touchAction = 'none';
  const P = (e, type) => E.touch(type, e.clientX * dpr, e.clientY * dpr, e.pointerId);
  cv.addEventListener('pointerdown', e => { dragged = false; downX = e.clientX; downY = e.clientY; downT = performance.now(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} P(e, 'down'); });
  cv.addEventListener('pointermove', e => {
    if (!e.buttons && e.pointerType === 'mouse') return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) dragged = true;
    P(e, 'move');
  });
  const up = e => { if (performance.now() - downT > 350) dragged = true; P(e, 'up'); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}
cv.addEventListener('click', () => { if (dragged) { dragged = false; return; } sheet.hidden = !sheet.hidden; hint.classList.add('gone'); });
setTimeout(() => hint.classList.add('gone'), 3500);

// Vollbild: immer echtes Vollbild versuchen; wenn die Ansicht es sperrt, bleibt die Leinwand ohne Bedienelemente
const fsBtn = document.getElementById('fsBtn');
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let toastTimer = 0;
function toast(msg) {
  hint.textContent = msg; hint.classList.add('msg'); hint.classList.remove('gone');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => hint.classList.add('gone'), 4000);
}
const fsBlocked = () => { if (!isFs()) toast('In dieser Ansicht ist Vollbild gesperrt. Öffne die Vorschau-Karte, dort geht es. Antippen holt die Einstellungen zurück.'); };
fsBtn.onclick = () => {
  sheet.hidden = true;
  try {
    if (isFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { fsBlocked(); return; }
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.then) r.then(() => setTimeout(fsBlocked, 300), fsBlocked); else setTimeout(fsBlocked, 500);
  } catch (e) { fsBlocked(); }
};
const fsLabel = () => { fsBtn.textContent = isFs() ? 'Vollbild beenden' : 'Vollbild'; };
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);

// Start
addEventListener('resize', resize);
resize();
E.newPattern();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  E.frame(ctx, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// So tun, als würde das Handy entsperrt: beim Öffnen und wenn die Seite wieder sichtbar wird
setTimeout(() => E.wake(), 450);
document.addEventListener('visibilitychange', () => { if (!document.hidden) E.wake(); });
window.__nw = { E, S };
})();
</script>
