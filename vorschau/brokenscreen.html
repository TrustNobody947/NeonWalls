<title>Broken Screen</title>
<style>
/* Layout: one full-screen canvas, single dark look; tapping the canvas reveals a control sheet */
:root{
  --bg:#000;
  --panel:rgba(12,14,18,.9);
  --fg:#e8ecf2;
  --muted:#8a93a3;
  --accent:#19e619;
  --line:rgba(255,255,255,.12);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
:root{padding:0!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;
  background:var(--panel);padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  transition:opacity .6s;pointer-events:none;white-space:nowrap;z-index:5}
.hint.msg{white-space:normal;text-transform:none;letter-spacing:0;font:500 13px/1.45 var(--font);color:var(--fg);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;border-radius:14px}
.hint.gone{opacity:0}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;
  font:14px/1.4 var(--font);display:grid;gap:14px;backdrop-filter:blur(8px)}
.sheet h2{margin:0;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
#controls{display:grid;gap:14px}
.row{display:grid;gap:6px}
.row label,.row .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.row output{font:12px var(--mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* Regler mit eigener Farbspur (z. B. Farbspektrum) */
input[type=range].track{-webkit-appearance:none;appearance:none;height:16px;margin:6px 0;border-radius:8px;background:var(--track);border:1px solid var(--line);outline:none}
input[type=range].track::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--sw,#fff);border:3px solid #fff;box-shadow:0 0 0 1px #000,0 1px 4px rgba(0,0,0,.6)}
input[type=range].track::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--sw,#fff);border:3px solid #fff;box-shadow:0 0 0 1px #000}
.row input[type=text]{width:100%;box-sizing:border-box;font:600 15px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:13px}
.seg button.on{background:var(--accent);color:#000;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid .grp{grid-column:1/-1;margin-top:6px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid button{min-width:0;padding:10px 8px;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.on{background:var(--accent);color:#000;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 auto;font:600 14px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#000;border-color:transparent}
</style>

<canvas id="c" aria-label="Animierter Hintergrund: kaputtes Display mit flackernden Farbstreifen und Glasrissen"></canvas>
<div class="hint" id="hint">Tippen für Einstellungen</div>

<div class="sheet" id="sheet" hidden>
  <h2>Broken Screen</h2>
  <p class="sub">Flackernde Farbstreifen hinter echtem Glasbruch: Das Handy ist aufgeschlagen, die Risse laufen quer übers Bild.</p>
  <div id="controls"></div>
  <div class="btns">
    <button id="newBtn" class="primary" type="button">Neues Muster</button>
    <button id="actBtn" type="button">Effekt</button>
    <button id="fsBtn" type="button">Vollbild</button>
    <button id="closeBtn" type="button">Schließen</button>
  </div>
</div>

<script>
(() => {
'use strict';
// Hilfsfunktionen für alle Effekte
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lvl = v => v == 0 ? 'aus' : v < 4 ? 'leicht' : v < 7 ? 'mittel' : 'stark';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
// Wahrscheinlichkeit für "rate mal pro Sekunde" bei Zeitschritt dt
const per = (rate, dt) => 1 - Math.exp(-rate * dt);

// ---------- Effekt ----------
const E = (function () {
// Broken Screen: flackernde Farbstreifen wie bei einem kaputten Display, dazu echte Glasrisse.
// Das Handy ist an einer Ecke oder Kante aufgeschlagen (zufällig, „Neues Muster“ würfelt neu) oder an einer selbst
// angetippten Stelle (zweites Antippen: wohin der Riss laufen soll). Von dort laufen die Risse sternförmig quer übers
// ganze Bild, manche mit Abzweig, an der Aufschlagstelle ein kleines Splitternetz. Auf Wunsch wechseln die Risse von
// selbst (bei Glitch-Ausbrüchen oder alle paar Stunden).
// Die Risse teilen das Display in Bruchstücke: Jedes Stück ist ein wenig versetzt und flackert für sich, die Streifen
// enden genau an der Risskante. Der Riss selbst: dunkle Bruchkante mit feinem Glanz daneben (Licht von oben).
// Mit Uhr läuft ein Riss mitten durch die Ziffern und weiter übers ganze Bild; die Uhr zerfällt dort in Stücke.
const settings = { cracks: 3, impact: 0, splinter: 1, auto: 0, hours: 6, shear: 5, calm: 4, burst: 5, countPos: 59,
  rndWake: 0, mutate: 0, clock: 0, crack: 5, pos: 0, size: 5, date: 0, finish: 7,
  // selbst angetippt: Aufschlag (px, py) und Richtung (tx, ty) als Anteil von Breite und Höhe
  px: -1, py: -1, tx: -1, ty: -1 };
const countFromPos = v => Math.round(3 * Math.pow(50, v / 100));
const controls = [
  { type: 'range', id: 'cracks', label: 'Anzahl Risse', min: 0, max: 6, fmt: v => v == 0 ? 'keine' : String(v) },
  { type: 'choice', id: 'impact', label: 'Aufschlagstelle', options: ['Zufällig', 'Selbst angetippt'] },
  { type: 'choice', id: 'splinter', label: 'Splitter am Aufschlag', options: ['Aus', 'Wenig', 'Viel'] },
  { type: 'choice', id: 'auto', label: 'Risse wechseln von selbst', options: ['Aus', 'Bei Glitches', 'Nach Stunden'] },
  { type: 'range', id: 'hours', label: 'Wechsel nach Stunden: alle', min: 1, max: 24, fmt: v => v + (v == 1 ? ' Stunde' : ' Stunden') },
  { type: 'range', id: 'shear', label: 'Versatz am Riss', min: 0, max: 10, fmt: lvl },
  { type: 'range', id: 'calm', label: 'Grundflackern', min: 0, max: 10, fmt: lvl },
  { type: 'range', id: 'burst', label: 'Glitch-Ausbrüche', min: 0, max: 10, fmt: lvl },
  { type: 'range', id: 'countPos', label: 'Anzahl Streifen', min: 0, max: 100, fmt: countFromPos },
  { type: 'choice', id: 'rndWake', label: 'Neues Muster bei jedem Einschalten', options: ['Aus', 'An'] },
  { type: 'choice', id: 'mutate', label: 'Glitches verändern das Muster', options: ['Aus', 'An'] },
  { type: 'choice', id: 'clock', label: 'Uhr', options: ['An', 'Aus'] },
  { type: 'range', id: 'crack', label: 'Riss durch die Uhr', min: 0, max: 10, fmt: lvl },
  { type: 'choice', id: 'pos', label: 'Position der Uhr', options: ['Oben', 'Mitte', 'Unten'] },
  { type: 'range', id: 'size', label: 'Größe der Uhr (5 = wie Original)', min: 1, max: 10, fmt: v => String(v) },
  { type: 'choice', id: 'date', label: 'Datum', options: ['Wie Original', 'Deutsch', 'Aus'] },
  { type: 'grid', id: 'finish', label: 'Oberfläche der Uhr', options: [
    { label: 'Chrom', group: 'Metall' }, { label: 'Gold', group: 'Metall' }, { label: 'Stahlblau', group: 'Metall' },
    { label: 'Roségold', group: 'Metall' }, { label: 'Schwarzchrom', group: 'Metall' }, { label: 'Kupfer', group: 'Metall' },
    { label: 'Neon leuchtend', group: 'Leuchtend' }, { label: 'Weiß', group: 'Wie Original' }] },
];
// Schablonen-Uhr: Schrift, Oberflächen und Uhr-Ebene (gemeinsam für uhr.js und brokenscreen.js).
// Erwartet im Effekt: settings (finish, size, date, pos), W, H (Gerätepixel) sowie mk, clamp aus dem Rahmen.
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// face: Verlauf über die Zeichenhöhe; lit/mid/shade: Fasen oben/seitlich/unten; side: Tiefe (nah, fern); date: Datumszeile
const FIN = [
  { face: [[0, '#ffffff'], [0.4, '#e4e7ed'], [0.49, '#a2a7b1'], [0.56, '#d6dae2'], [1, '#aab0ba']], lit: [255, 255, 255], mid: [196, 201, 210], shade: [62, 66, 74], side: [hex('#55595f'), hex('#141518')], date: [212, 216, 222] },
  { face: [[0, '#fff8de'], [0.4, '#f1d37e'], [0.49, '#9e7924'], [0.56, '#e7c56b'], [1, '#b68b2f']], lit: [255, 248, 220], mid: [214, 176, 90], shade: [86, 60, 16], side: [hex('#6a4e18'), hex('#1c1405')], date: [232, 196, 112] },
  { face: [[0, '#f2f8ff'], [0.4, '#bfd4ee'], [0.49, '#5f7995'], [0.56, '#aac3e0'], [1, '#7189a6']], lit: [240, 248, 255], mid: [150, 175, 205], shade: [28, 42, 60], side: [hex('#2c3d52'), hex('#0b1119')], date: [172, 196, 226] },
  // Roségold
  { face: [[0, '#fff1ea'], [0.4, '#f0bba6'], [0.49, '#99604e'], [0.56, '#e5aa94'], [1, '#b67b67']], lit: [255, 240, 232], mid: [218, 162, 142], shade: [92, 50, 40], side: [hex('#6e4135'), hex('#1d100b')], date: [232, 176, 156] },
  // Schwarzchrom: dunkler Spiegel, nur die Kanten blitzen hell
  { face: [[0, '#a4aab4'], [0.4, '#3b3e46'], [0.49, '#0b0c0f'], [0.56, '#2d3038'], [1, '#14161a']], lit: [225, 230, 240], mid: [74, 78, 88], shade: [6, 7, 9], side: [hex('#26282d'), hex('#040405')], date: [118, 124, 134] },
  // Kupfer
  { face: [[0, '#fff0de'], [0.4, '#e99b62'], [0.49, '#8a4a22'], [0.56, '#da8b52'], [1, '#a95d2c']], lit: [255, 236, 214], mid: [206, 130, 82], shade: [80, 36, 14], side: [hex('#6a3516'), hex('#1c0c04')], date: [222, 146, 98] },
  // Neon leuchtend: helle Fläche mit Schein, wie eine Leuchtröhre in Ziffernform
  { neon: [40, 225, 255], face: [[0, '#ffffff'], [0.45, '#e6fdff'], [1, '#a8f1ff']], lit: [255, 255, 255], mid: [176, 242, 255], shade: [52, 168, 205], side: [hex('#0d4b5d'), hex('#021116')], date: [196, 246, 255] },
  // Weiß wie das Original: matte weiße Fläche, Fasen hellgrau, Unterkanten grau, dunkle Kante darunter; Datum flach hellgrau
  { face: [[0, '#ffffff'], [1, '#ffffff']], lit: [255, 255, 255], mid: [220, 221, 222], shade: [172, 174, 178], side: [[60, 64, 68], [24, 26, 28]], date: [218, 218, 218] },
];
const mixC = (a, b, k) => [a[0] + (b[0] - a[0]) * k | 0, a[1] + (b[1] - a[1]) * k | 0, a[2] + (b[2] - a[2]) * k | 0];
const rgbS = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

// ---------- Schrift: Balken mit 45°-Fasen auf dem Raster der Original-Uhr ----------
// Einheiten: Zeichenhöhe GH = 153 (9 × 17). Zweispaltige Zeichen: linke Spalte 0..BW, rechte Spalte XR..CW.
const GH = 153, BW = 18.5, GAP = 15, CW = 2 * BW + GAP, CH = 17, XR = BW + GAP, XM = (CW - BW) / 2;
// Balken in einer Spalte von y0 bis y1; Fase oben/unten links ('l'), rechts ('r') oder gerade ('-')
function bar(x0, y0, y1, top, bot, w) {
  const x1 = x0 + (w || BW);
  return [[x0, y0 + (top === 'l' ? CH : 0)], [x1, y0 + (top === 'r' ? CH : 0)], [x1, y1 - (bot === 'r' ? CH : 0)], [x0, y1 - (bot === 'l' ? CH : 0)]];
}
// Balken über die ganze Höhe mit spitzer Kerbe in der Mitte (rechte Spalte von 3 und 8, linke Spalte von 8)
const notchR = x0 => [[x0, 0], [x0 + BW, CH], [x0 + BW, 62], [x0 + 3.5, 76.5], [x0 + BW, 91], [x0 + BW, GH - CH], [x0, GH]];
const notchL = x0 => [[x0, CH], [x0 + BW, 0], [x0 + BW, GH], [x0, GH - CH], [x0, 91], [x0 + BW - 3.5, 76.5], [x0, 62]];
// waagerechter Balken mit schräg abgeschnittenem rechtem Ende (E, F)
const hbar = y0 => [[0, y0], [CW - BW, y0], [CW, y0 + BW], [0, y0 + BW]];
const M3 = BW + GAP; // Abstand der Balken bei M und W (drei Balken)
const GLYPHS = {
  '0': [bar(0, 0, GH, 'l', 'l'), bar(XR, 0, GH, 'r', 'r')],
  '1': [bar(XM, 0, GH, 'l', 'l')],
  '2': [bar(0, 0, 52, 'l', 'l'), bar(0, 85, GH, 'l', '-'), bar(XR, 0, 85, 'r', 'r'), bar(XR, 118, GH, 'r', '-')],
  '3': [bar(0, 0, 52, 'l', 'l'), bar(0, 101, GH, 'l', 'l'), notchR(XR)],
  '4': [bar(0, 0, 102, 'l', 'l'), bar(XR, 0, GH, 'l', 'l')],
  '5': [bar(0, 0, 85, '-', 'l'), bar(0, 101, GH, 'l', 'l'), bar(XR, 0, 35, '-', 'r'), bar(XR, 68, GH, 'r', 'r')],
  '6': [bar(0, 0, GH, 'l', 'l'), bar(XR, 0, 35, 'r', '-'), bar(XR, 68, GH, 'r', 'r')],
  '7': [bar(0, 0, 35, '-', 'r'), bar(XR, 0, GH, '-', 'r')],
  '8': [notchL(0), notchR(XR)],
  '9': [bar(0, 0, 85, 'l', 'l'), bar(0, 118, GH, '-', 'l'), bar(XR, 0, GH, 'r', 'r')],
  ':': [[[0, 17], [28.5, 0], [28.5, 52], [0, 35]], [[0, 118], [28.5, 101], [28.5, GH], [0, 136]]],
  '.': [[[0, GH - 17], [16, GH - 17], [16, GH], [0, GH]]],
  'A': [bar(0, 0, GH, 'l', '-'), bar(XR, 0, GH, 'r', '-')],
  'D': [bar(0, 0, GH, '-', '-'), bar(XR, 0, GH, 'r', 'r')],
  'E': [hbar(0), hbar(66), hbar(GH - BW)],
  'F': [hbar(0), [[0, 66], [CW - BW, 66], [CW, 66 + BW], [BW, 66 + BW], [BW, GH], [0, GH]]],
  'H': [bar(0, 0, GH, '-', '-'), bar(XR, 0, GH, '-', '-'), [[BW, 68], [XR, 85], [BW, 85]]],
  'I': [bar(0, 0, GH, '-', '-')],
  'M': [bar(0, 0, GH, 'l', '-'), bar(M3, 0, GH, '-', '-'), bar(2 * M3, 0, GH, 'r', '-')],
  'N': [bar(0, 0, GH, '-', '-'), bar(XR, 0, GH, 'r', '-')],
  'O': [bar(0, 0, GH, 'l', 'l'), bar(XR, 0, GH, 'r', 'r')],
  'R': [bar(0, 0, GH, 'l', '-'), [[XR, 0], [CW, CH], [CW, 66], [XR + 1, 84], [CW, 84], [CW, GH], [XR, GH]]],
  'S': [bar(0, 0, 85, 'l', 'l'), bar(0, 102, GH, 'l', 'l'), bar(XR, 0, 51, 'r', 'r'), bar(XR, 68, GH, 'r', 'r')],
  'T': [[[0, 0], [CW, 0], [CW, BW], [XM + BW, BW], [XM + BW, GH], [XM, GH], [XM, BW], [0, BW]]],
  'U': [[[0, 0], [BW, 0], [BW, GH - CH], [XR, GH - CH], [XR, 0], [CW, 0], [CW, GH - CH], [XR, GH], [BW, GH], [0, GH - CH]]],
  'W': [bar(0, 0, GH, '-', 'l'), bar(M3, 0, GH, '-', '-'), bar(2 * M3, 0, GH, '-', 'r')],
};
// Zeichen mit Tintengrenzen (x0..x1) für die Datumszeile mit Proportionalschrift
function glyph(ch) {
  const S = GLYPHS[ch] || [];
  let x0 = 0, x1 = 0;
  if (S.length) { x0 = 1e9; x1 = -1e9; for (const p of S) for (const q of p) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); } }
  // Breite: Ziffern immer eine volle Zelle (die 1 steht mittig darin), sonst bis zum rechten Rand der Form
  return { S, x0, x1, w: ch >= '0' && ch <= '9' ? CW : x1 };
}
// Fläche: Verlaufsfarbe in der Höhe v (0 oben, 1 unten)
function faceAt(F, v) {
  const st = F.face;
  if (v <= st[0][0]) return hex(st[0][1]);
  for (let i = 1; i < st.length; i++) if (v <= st[i][0]) return mixC(hex(st[i - 1][1]), hex(st[i][1]), (v - st[i - 1][0]) / (st[i][0] - st[i - 1][0]));
  return hex(st[st.length - 1][1]);
}
// Ein Teilstück mit Fasen einfärben: jedes Pixel bekommt die Farbe der nächsten Kante, wenn es näher als die Fasenbreite
// an ihr liegt (Licht von oben: Oberkanten hell, Seiten mittel, Unterkanten dunkel), sonst die Flächenfarbe.
function shadePoly(x, P, F, bev, top, hPx) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const q of P) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
  const bx = Math.floor(x0) - 1, by = Math.floor(y0) - 1, bw = Math.ceil(x1) - bx + 2, bh = Math.ceil(y1) - by + 2;
  const t = mk(bw, bh), tx = t.getContext('2d');
  tx.beginPath(); tx.moveTo(P[0][0] - bx, P[0][1] - by);
  for (let i = 1; i < P.length; i++) tx.lineTo(P[i][0] - bx, P[i][1] - by);
  tx.closePath(); tx.fillStyle = '#fff'; tx.fill();
  const id = tx.getImageData(0, 0, bw, bh), d = id.data, n = P.length, E = [];
  for (let i = 0; i < n; i++) {
    const a = P[i], b = P[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    if (L2 < 1e-6) continue;
    const lam = dx / Math.sqrt(L2);
    E.push([a[0], a[1], dx, dy, L2, lam > 0 ? mixC(F.mid, F.lit, lam) : mixC(F.mid, F.shade, -lam)]);
  }
  const rows = [];
  for (let yy = 0; yy < bh; yy++) rows.push(faceAt(F, (by + yy + 0.5 - top) / hPx));
  for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
    const o = (yy * bw + xx) * 4;
    if (!d[o + 3]) continue;
    const px = bx + xx + 0.5, py = by + yy + 0.5;
    let best = 1e18, col = null;
    for (const e of E) {
      let k = ((px - e[0]) * e[2] + (py - e[1]) * e[3]) / e[4];
      k = k < 0 ? 0 : k > 1 ? 1 : k;
      const qx = e[0] + e[2] * k - px, qy = e[1] + e[3] * k - py, dd = qx * qx + qy * qy;
      if (dd < best) { best = dd; col = e[5]; }
    }
    const fc = rows[yy], m = clamp((Math.sqrt(best) - bev + 0.5), 0, 1);
    d[o] = col[0] + (fc[0] - col[0]) * m; d[o + 1] = col[1] + (fc[1] - col[1]) * m; d[o + 2] = col[2] + (fc[2] - col[2]) * m;
  }
  tx.putImageData(id, 0, 0);
  x.drawImage(t, bx, by);
}
// Zeichen als fertiges Bild: Uhrzeit mit Fasen und Tiefe, Datum flach (wie beim Original)
const cache = {};
function sprite(ch, hPx, flat) {
  const key = settings.finish + '|' + ch + '|' + hPx + '|' + (flat ? 1 : 0);
  if (cache[key]) return cache[key];
  const F = FIN[settings.finish] || FIN[0], gl = glyph(ch), u = hPx / GH;
  const depth = flat ? 0 : Math.max(1, Math.round(hPx * 0.026));
  const pad = depth + 3 + (F.neon ? Math.round(hPx * (flat ? 0.45 : 0.3)) : 0), bev = Math.max(1, hPx * 0.026);
  const cw = Math.max(1, Math.ceil(gl.w * u + pad * 2)), chh = Math.max(1, Math.ceil(hPx + pad * 2 + depth));
  const c = mk(cw, chh), x = c.getContext('2d');
  const S = gl.S.map(p => p.map(q => [pad + q[0] * u, pad + q[1] * u]));

  // Versatz des Stücks: zur Seite und etwas nach unten, Stärke nach „Riss durch die Uhr“
  const k = g ? settings.crack : 0;
  const X = lx + (g ? Math.round(g.s * k * 0.9 * dpr * jit()) : 0), Y = ly + (g ? Math.round(Math.abs(g.s) * k * 0.12 * dpr) : 0);
  ctx.globalAlpha = z.fl;
  if (z.split > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(layerC[0], X + z.sx, Y); ctx.drawImage(layerC[1], X, Y); ctx.drawImage(layerC[2], X - z.sx, Y);
  } else if (z.slice > 0) {
    const n = rint(3, 6);
    for (let s = 0; s < n; s++) {
      const sy = Math.floor(lh * s / n), sh = Math.ceil(lh / n);
      ctx.drawImage(layer, 0, sy, lw, sh, X + rnd(-1, 1) * 10 * dpr, Y + sy, lw, sh);
    }
  } else ctx.drawImage(layer, X, Y);
  if (z.flash > 0) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.75 * z.fl; ctx.drawImage(tinted(z.col), X, Y);
  }
  // einzelne Streifen glitchen: in ihrem Band verrutscht die Uhr und nimmt ihre Farbe an
  let nb = 0;
  for (const b of bands) {
    const bx = b.x * dpr, bw = Math.max(2, b.w * dpr);
    if (bx + bw / 2 < X || bx - bw / 2 > X + lw || ++nb > 10) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(bx - bw / 2, Y - 2, bw, lh + 4); ctx.clip();
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(bx - bw / 2, Y, bw, lh);
    ctx.globalAlpha = z.fl; ctx.drawImage(layer, X + b.dx * dpr, Y);
    ctx.globalAlpha = 0.55 * z.fl; ctx.drawImage(tinted(b.col), X + b.dx * dpr, Y);
    ctx.restore();
  }
  ctx.restore();
}
// glitchende Streifen eines Bruchstücks (ri) bzw. aller Stücke im Bereich der Uhr (ri = -1)
function glitchBands(ri) {
  const out = [];
  const regs = CR ? CR.regions : WHOLE;
  regs.forEach((g, i) => {
    if (ri >= 0 ? i !== ri : (CR && !g.clock)) return;
    for (const d of drawList[i] || []) if (d.fl) out.push({ x: d.x, w: d.fl.w, dx: d.fl.dx, col: d.fl.col });
  });
  return out;
}
function drawClock(ctx, calm) {
  if (!layer) return;
  const pieces = CR && settings.crack > 0 ? CR.regions.filter(g => g.clock) : [];
  if (pieces.length < 2) { drawClockPiece(ctx, null, 'ganz', calm, glitchBands(-1)); return; }
  for (const g of pieces) { const i = CR.regions.indexOf(g); drawClockPiece(ctx, g, i, calm, glitchBands(i)); }
}

// ---------- Aufschlag antippen, Risse von selbst wechseln ----------
let api = null, tapStep = 0, tapP = null, autoT = 0;
function newCracks() { crackSeed = (Math.random() * 2147483647) | 0; makeCracks(); autoT = 0; }
function startTap() {
  tapStep = 1; tapP = null;
  if (api) { api.hideSheet(); api.toast('Tippe auf die Stelle, an der das Handy aufgeschlagen ist.', 60000); }
}

return {
  maxDpr: 4,
  settings, controls,
  actionLabel: 'Glitch jetzt',
  buttons: [{ label: 'Aufschlag antippen', run: startTap }],
  bindUI(a) { api = a; },
  // Antippen im Auswahlmodus: erst die Aufschlagstelle, dann die Richtung des Risses
  tap(x, y) {
    if (!tapStep) return false;
    const fx = clamp(x / W, 0, 1), fy = clamp(y / H, 0, 1);
    if (tapStep === 1) {
      tapP = [fx, fy]; tapStep = 2;
      if (api) api.toast('Und jetzt dorthin tippen, wohin der Riss laufen soll.', 60000);
      return true;
    }
    tapStep = 0;
    if (api) { api.set('px', tapP[0]); api.set('py', tapP[1]); api.set('tx', fx); api.set('ty', fy); api.set('impact', 1); }
    else { settings.px = tapP[0]; settings.py = tapP[1]; settings.tx = fx; settings.ty = fy; settings.impact = 1; }
    tapP = null;
    newCracks();
    if (api) api.toast('Fertig! „Neues Muster“ zeigt einen anderen Verlauf, unter „Aufschlagstelle“ geht es zurück auf Zufall.', 5000);
    return true;
  },
  resize(w, h, d) {
    W = w; H = h; dpr = d; Wc = W / dpr; Hc = H / dpr;
    for (const k in cache) delete cache[k];
    buildLayer();
    makeCracks();
  },
  newPattern() { newLines(); newCracks(); },
  action() { triggerBurst(); if (settings.auto === 1 && burstZone === 'all') newCracks(); },
  wake() {
    if (settings.rndWake === 1) { newLines(); newCracks(); }
    triggerBurst('all'); burstT = rnd(0.25, 0.6);
  },
  change(id) {
    if (id === 'countPos') newLines();
    if (id === 'burst') { nextBurst = scheduleBurst(settings.burst / 10); burstT = 0; }
    if (id === 'finish') for (const k in cache) delete cache[k];
    if (id === 'size' || id === 'date' || id === 'finish' || id === 'pos') buildLayer();
    if (id === 'cracks' || id === 'splinter' || id === 'clock' || id === 'crack' || id === 'size' || id === 'date' || id === 'pos') makeCracks();
    // „Selbst angetippt“ ohne angetippte Stelle: gleich antippen lassen
    if (id === 'impact') { if (settings.impact === 1 && !(settings.px >= 0 && settings.tx >= 0)) startTap(); else { tapStep = 0; newCracks(); } }
    if (id === 'auto' || id === 'hours') autoT = 0;
  },
  // zum Ausprobieren in der Entwicklung: bestimmter Zufallswert für die Risse
  seed(v) { crackSeed = v | 0; makeCracks(); },
  info() { return CR; },
  // Entwicklung: alle Streifen kurz aufblitzen lassen
  flashAll(n) { lines.slice(0, n || lines.length).forEach(L => { L.flash = 0.2; L.flashCol = pick(PAL); L.bw = 10; L.bdx = 4; L.mask = null; }); },
  frame(ctx, dt) {
    t += dt; cx = ctx;
    const calm = settings.calm / 10, bur = settings.burst / 10;
    const TX = texts();
    if (stamp !== TX.time + TX.ds) { buildLayer(); updateClockPieces(); }
    if (burstT > 0) {
      burstT -= dt;
      // nach einem Glitch-Ausbruch manchmal ein neues Streifenmuster (Risse bleiben)
      if (burstT <= 0 && settings.mutate === 1 && Math.random() < 0.5) { newLines(); }
    }
    else if (bur > 0) {
      nextBurst -= dt;
      if (nextBurst <= 0) {
        triggerBurst(); nextBurst = scheduleBurst(bur);
        // Risse wechseln mit großen Glitch-Ausbrüchen
        if (settings.auto === 1 && burstZone === 'all') newCracks();
      }
    }
    // Risse wechseln nach Stunden
    if (settings.auto === 2) { autoT += dt; if (autoT >= settings.hours * 3600) newCracks(); }
    curDt = dt; curBursting = burstT > 0;
    curG = bur > 0 ? 0.02 + 0.98 * Math.pow(bur, 1.6) : 0;
    const bursting = curBursting && burstZone === 'all';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = bursting && Math.random() < 0.3 ? 'rgba(0,30,10,.5)' : 'rgba(0,12,4,.6)'; ctx.fillRect(0, 0, W, H);
    stripeStates(dt, calm, bursting);
    if (settings.clock === 0) drawClock(ctx, calm);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
    drawStripes(bursting);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // Glasrisse über allem
    if (crackLayer) ctx.drawImage(crackLayer, 0, 0);
    // beim Antippen: Markierung der gewählten Aufschlagstelle, bis die Richtung angetippt ist
    if (tapStep === 2 && tapP) {
      const mx = tapP[0] * W, my = tapP[1] * H;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.arc(mx, my, 10 * dpr, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx, my, 2 * dpr, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
    }
  },
};

})();

// ---------- Rahmen: Leinwand, Einstellungen, Bedienung ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const S = E.settings, KEY = 'nw-brokenscreen';
try { const sv = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in sv) if (k in S && typeof sv[k] === typeof S[k]) S[k] = sv[k]; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, E.maxDpr || 3);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h; cv.width = W; cv.height = H;
  E.resize(W, H, dpr);
}

// Regler und Auswahlknöpfe aus der Beschreibung des Effekts bauen
const box = document.getElementById('controls'), ui = {};
// Wert setzen und Anzeige nachziehen (auch für den Effekt selbst, z. B. automatische Schriftwahl)
const setVal = (id, v) => { S[id] = v; if (ui[id]) ui[id](v); save(); };
for (const c of E.controls) {
  const row = document.createElement('div'); row.className = 'row';
  if (c.type === 'range') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + ' <output></output></label>' +
      '<input id="' + c.id + '" type="range" min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '">';
    box.appendChild(row);
    const el = row.querySelector('input'), out = row.querySelector('output'), fmt = c.fmt || String;
    if (c.track) { el.classList.add('track'); el.style.setProperty('--track', c.track); }
    ui[c.id] = v => { el.value = v; out.textContent = fmt(+v); if (c.swatch) el.style.setProperty('--sw', c.swatch(+v)); };
    ui[c.id](S[c.id]);
    el.addEventListener('input', () => { S[c.id] = +el.value; out.textContent = fmt(S[c.id]); if (c.swatch) el.style.setProperty('--sw', c.swatch(S[c.id])); save(); if (E.change) E.change(c.id); });
  } else if (c.type === 'choice' || c.type === 'grid') {
    // 'grid': viele Möglichkeiten in zwei Spalten, mit Zwischenüberschriften und eigener Schrift je Knopf
    row.innerHTML = '<span class="lbl">' + c.label + '</span><div class="' + (c.type === 'grid' ? 'grid' : 'seg') + '"></div>';
    box.appendChild(row);
    const wrap = row.querySelector('.grid, .seg'), btns = [];
    let group = null;
    c.options.forEach((o, i) => {
      if (o.group && o.group !== group) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = o.group; wrap.appendChild(h); group = o.group; }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = typeof o === 'string' ? o : o.label;
      if (o.font) b.style.fontFamily = o.font;
      if (o.weight) b.style.fontWeight = o.weight;
      b.addEventListener('click', () => { setVal(c.id, i); if (E.change) E.change(c.id); });
      wrap.appendChild(b); btns.push(b);
    });
    ui[c.id] = v => btns.forEach((b, j) => b.classList.toggle('on', j === v));
    ui[c.id](S[c.id]);
  } else if (c.type === 'text') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + '</label>' +
      '<input id="' + c.id + '" type="text" maxlength="' + (c.max || 20) + '" autocomplete="off" spellcheck="false">';
    box.appendChild(row);
    const el = row.querySelector('input'); el.value = S[c.id];
    ui[c.id] = v => { el.value = v; };
    el.addEventListener('input', () => { S[c.id] = el.value; save(); if (E.change) E.change(c.id); });
  }
}
// Schnittstelle für Effekte: Werte setzen, kurze Hinweise zeigen, Einstellungen ausblenden
if (E.bindUI) E.bindUI({ set: setVal, toast: (m, ms) => toast(m, ms), hideSheet: () => { sheet.hidden = true; } });
// zusätzliche Knöpfe des Effekts (z. B. „Aufschlag antippen“)
if (E.buttons) {
  const row = document.querySelector('.btns'), fs = document.getElementById('fsBtn');
  for (const b of E.buttons) {
    const el = document.createElement('button'); el.type = 'button'; el.textContent = b.label;
    el.addEventListener('click', () => b.run());
    row.insertBefore(el, fs);
  }
}
if (E.hint) hint.textContent = E.hint;
document.getElementById('actBtn').textContent = E.actionLabel;
document.getElementById('newBtn').onclick = () => E.newPattern();
document.getElementById('actBtn').onclick = () => E.action();
document.getElementById('closeBtn').onclick = () => { sheet.hidden = true; };
// Berührung: Effekte mit E.touch bekommen Finger-Positionen (Gerätepixel). Kurzes Tippen ohne Bewegen
// öffnet weiterhin die Einstellungen, Wischen oder langes Halten nicht.
let dragged = false, downX = 0, downY = 0, downT = 0;
if (E.touch) {
  cv.style.touchAction = 'none';
  const P = (e, type) => E.touch(type, e.clientX * dpr, e.clientY * dpr, e.pointerId);
  cv.addEventListener('pointerdown', e => { dragged = false; downX = e.clientX; downY = e.clientY; downT = performance.now(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} P(e, 'down'); });
  cv.addEventListener('pointermove', e => {
    if (!e.buttons && e.pointerType === 'mouse') return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) dragged = true;
    P(e, 'move');
  });
  const up = e => { if (performance.now() - downT > 350) dragged = true; P(e, 'up'); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}
cv.addEventListener('click', e => {
  if (dragged) { dragged = false; return; }
  // Effekte können ein Antippen für sich nutzen (z. B. Aufschlagstelle wählen)
  if (E.tap && E.tap(e.clientX * dpr, e.clientY * dpr)) return;
  sheet.hidden = !sheet.hidden; hint.classList.add('gone');
});
setTimeout(() => hint.classList.add('gone'), 3500);

// Vollbild: immer echtes Vollbild versuchen; wenn die Ansicht es sperrt, bleibt die Leinwand ohne Bedienelemente
const fsBtn = document.getElementById('fsBtn');
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let toastTimer = 0;
function toast(msg, ms) {
  hint.textContent = msg; hint.classList.add('msg'); hint.classList.remove('gone');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => hint.classList.add('gone'), ms || 4000);
}
const fsBlocked = () => { if (!isFs()) toast('In dieser Ansicht ist Vollbild gesperrt. Öffne die Vorschau-Karte, dort geht es. Antippen holt die Einstellungen zurück.'); };
fsBtn.onclick = () => {
  sheet.hidden = true;
  try {
    if (isFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { fsBlocked(); return; }
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.then) r.then(() => setTimeout(fsBlocked, 300), fsBlocked); else setTimeout(fsBlocked, 500);
  } catch (e) { fsBlocked(); }
};
const fsLabel = () => { fsBtn.textContent = isFs() ? 'Vollbild beenden' : 'Vollbild'; };
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);

// Start
addEventListener('resize', resize);
resize();
E.newPattern();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  E.frame(ctx, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// So tun, als würde das Handy entsperrt: beim Öffnen und wenn die Seite wieder sichtbar wird
setTimeout(() => E.wake(), 450);
document.addEventListener('visibilitychange', () => { if (!document.hidden) E.wake(); });
window.__nw = { E, S };
})();
</script>
