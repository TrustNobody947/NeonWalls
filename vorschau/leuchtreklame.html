<title>Leuchtreklame</title>
<style>
/* Layout: one full-screen canvas, single dark look; tapping the canvas reveals a control sheet */
:root{
  --bg:#000;
  --panel:rgba(12,14,18,.9);
  --fg:#e8ecf2;
  --muted:#8a93a3;
  --accent:#ff4fd8;
  --line:rgba(255,255,255,.12);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
:root{padding:0!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;
  background:var(--panel);padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  transition:opacity .6s;pointer-events:none;white-space:nowrap;z-index:5}
.hint.msg{white-space:normal;text-transform:none;letter-spacing:0;font:500 13px/1.45 var(--font);color:var(--fg);
  width:max-content;max-width:calc(100vw - 32px);text-align:center;border-radius:14px}
.hint.gone{opacity:0}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;
  font:14px/1.4 var(--font);display:grid;gap:14px;backdrop-filter:blur(8px)}
.sheet h2{margin:0;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet .sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
#controls{display:grid;gap:14px}
.row{display:grid;gap:6px}
.row label,.row .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.row output{font:12px var(--mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* Regler mit eigener Farbspur (z. B. Farbspektrum) */
input[type=range].track{-webkit-appearance:none;appearance:none;height:16px;margin:6px 0;border-radius:8px;background:var(--track);border:1px solid var(--line);outline:none}
input[type=range].track::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--sw,#fff);border:3px solid #fff;box-shadow:0 0 0 1px #000,0 1px 4px rgba(0,0,0,.6)}
input[type=range].track::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--sw,#fff);border:3px solid #fff;box-shadow:0 0 0 1px #000}
.row input[type=text]{width:100%;box-sizing:border-box;font:600 15px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:13px}
.seg button.on{background:var(--accent);color:#000;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid .grp{grid-column:1/-1;margin-top:6px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid button{min-width:0;padding:10px 8px;font-size:18px;font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.on{background:var(--accent);color:#000;border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 auto;font:600 14px var(--font);color:var(--fg);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#000;border-color:transparent}
</style>

<canvas id="c" aria-label="Animierter Hintergrund: Neonschild mit eigenem Text und flackernden Buchstaben"></canvas>
<div class="hint" id="hint">Tippen für Einstellungen</div>

<div class="sheet" id="sheet" hidden>
  <h2>Leuchtreklame</h2>
  <p class="sub">Dein eigener Text als Neonschild, mit Buchstaben, die nicht ganz mitspielen.</p>
  <div id="controls"></div>
  <div class="btns">
    <button id="newBtn" class="primary" type="button">Neues Muster</button>

    <button id="fsBtn" type="button">Vollbild</button>
    <button id="closeBtn" type="button">Schließen</button>
  </div>
</div>

// Abstand zum nächsten Nullpixel (Fasenmaß 1 / Wurzel 2), zwei Durchläufe

    if (y > 0) {

      if (x > 0 && D[i - w - 1] + R2 < v) v = D[i - w - 1] + R2;
      if (x < w - 1 && D[i - w + 1] + R2 < v) v = D[i - w + 1] + R2;

    D[i] = v;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x; let v = D[i];
    if (v === 0) continue;
    if (x < w - 1 && D[i + 1] + 1 < v) v = D[i + 1] + 1;
    if (y < h - 1) {
      if (D[i + w] + 1 < v) v = D[i + w] + 1;
      if (x < w - 1 && D[i + w + 1] + R2 < v) v = D[i + w + 1] + R2;

  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const hash2 = (a, b) => { const s = Math.sin(a * 91.7 + b * 47.3 + 3.1) * 15731.743; return s - Math.floor(s); };
function genAlbedo() {
  alb = null;
  if (settings.wall === 3) return;
  const aw = Math.ceil((W + 2 * bgM) * AS), ah = Math.ceil((H + 2 * bgM) * AS);
  const c = mk(aw, ah), x = c.getContext('2d'), img = x.createImageData(aw, ah), d = img.data;
  const U = Math.min(W, H * 0.6), wall = settings.wall;
  // Backstein
  const bL = U * 0.21, bH = bL * 0.31, mo = bH * 0.13, cw = bL + mo, ch = bH + mo;
  // Beton: Schalungstafeln mit Ankerlöchern
  const pw = U * 0.62, ph = pw * 0.5, hole = U * 0.014;
  // Holz: senkrechte Bretter
  const bw = U * 0.17;
  for (let py = 0; py < ah; py++) for (let px = 0; px < aw; px++) {
    const X = px / AS - bgM, Y = py / AS - bgM, q = (py * aw + px) * 4;
    let r, g, b;
    const big = 0.82 + 0.3 * vnoise(X / (U * 0.5), Y / (U * 0.5));
    if (wall === 0) {
      const row = Math.floor(Y / ch), ly = Y - row * ch, shift = (row & 1) ? cw * 0.5 : 0;
      const col = Math.floor((X + shift) / cw), lx = X + shift - col * cw;
      const fine = vnoise(X / (U * 0.012), Y / (U * 0.012)), grain = (Math.random() - 0.5) * 0.14;
      if (lx < bL && ly < bH) {
        const hs = hash2(col, row), hs2 = hash2(row + 7, col - 3);
        let br = 0.55 + 0.2 * hs, bg = br * (0.4 + 0.12 * hs2), bb = br * (0.33 + 0.1 * hs2);
        if (hs2 > 0.86) { br *= 0.55; bg *= 0.55; bb *= 0.6; }
        else if (hs2 < 0.08) { br *= 1.08; bg *= 1.25; bb *= 1.2; }
        const edge = Math.min(lx, bL - lx, ly, bH - ly) / (bH * 0.16) + (fine - 0.5) * 0.9;
        const ao = 0.5 + 0.5 * smooth(0, 1, edge);
        const tex = 0.8 + 0.28 * fine + grain + 0.12 * vnoise(X / (U * 0.04) + col * 3.7, Y / (U * 0.04));
        r = br * ao * tex; g = bg * ao * tex; b = bb * ao * tex;
      } else {
        const tex = 0.7 + 0.35 * fine + grain * 1.4;
        r = 0.3 * tex; g = 0.29 * tex; b = 0.275 * tex;
      }
    } else if (wall === 1) {
      const fine = vnoise(X / (U * 0.02), Y / (U * 0.02)), mid = vnoise(X / (U * 0.11) + 5, Y / (U * 0.11));
      let v = 0.42 + 0.14 * mid + 0.1 * fine + (Math.random() - 0.5) * 0.08;
      const sx = ((X % pw) + pw) % pw, sy = ((Y % ph) + ph) % ph;
      if (Math.min(sx, pw - sx) < 1.2 / AS || Math.min(sy, ph - sy) < 1.2 / AS) v *= 0.7;
      const hx = sx - pw * 0.25 - Math.round((sx - pw * 0.25) / (pw * 0.5)) * pw * 0.5, hy = sy - ph * 0.5;
      const hd = Math.hypot(hx, hy);
      if (hd < hole) v *= 0.32 + 0.3 * (hd / hole); else if (hd < hole * 1.5) v *= 1.08;
      const cx2 = Math.floor(X / (U * 0.02)), cy2 = Math.floor(Y / (U * 0.02));
      if (hash2(cx2, cy2) > 0.965) {
        const px2 = (cx2 + 0.5) * U * 0.02, py2 = (cy2 + 0.5) * U * 0.02, pr = U * 0.0045 * (0.5 + hash2(cy2, cx2));
        if (Math.hypot(X - px2, Y - py2) < pr) v *= 0.45;
      }
      r = v; g = v * 0.985; b = v * 0.97;
    } else {
      const col = Math.floor(X / bw), lx = X - col * bw, hs = hash2(col, 11);
      const gn = vnoise(X / (U * 0.006) + col * 13, Y / (U * 0.12)), rings = Math.sin((lx / bw) * 18 + gn * 9 + hs * 20);
      let v = 0.75 + 0.18 * rings * (0.5 + 0.5 * gn) + 0.12 * vnoise(X / (U * 0.03), Y / (U * 0.4)) + (Math.random() - 0.5) * 0.06;
      if (lx < 1.4 / AS || lx > bw - 1.4 / AS) v *= 0.25;
      const knot = Math.hypot(lx - bw * hs, (Y % (U * 1.7)) - U * 0.9 * hash2(col, 5));
      if (knot < U * 0.03) v *= 0.7 + 0.3 * knot / (U * 0.03);

    d[q] = Math.min(255, r * 255); d[q + 1] = Math.min(255, g * 255); d[q + 2] = Math.min(255, b * 255); d[q + 3] = 255;
  }

}
function makeLightCanvases() {
  ln = mk(Math.ceil((W + 2 * bgM) * LN), Math.ceil((H + 2 * bgM) * LN)); lnx = ln.getContext('2d');
  lf = mk(Math.ceil((W + 2 * bgM) * LF), Math.ceil((H + 2 * bgM) * LF)); lfx = lf.getContext('2d');
  wc = mk(Math.ceil((W + 2 * bgM) * AS), Math.ceil((H + 2 * bgM) * AS)); wcx = wc.getContext('2d');
}

// Defekte Röhren auswählen
function pickKinds() {
  const n = units.length, k = settings.broken > 0 ? Math.max(1, Math.round(n * settings.broken / 10 * 0.5)) : 0;
  const idx = units.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, k);
  units.forEach(u => { u.kind = 'ok'; u.seq = []; });
  for (const i of idx) units[i].kind = pick(['stutter', 'stutter', 'dead', 'dim', 'buzz']);
}
// Ablauf der Helligkeit einer Röhre als Folge von [Dauer, Helligkeit]
function nextSeq(u) {
  const fl = settings.flicker / 10, s = u.seq;
  switch (u.kind) {
    case 'stutter':
      s.push([rnd(1.2, 6) / (0.4 + fl), 1]);
      for (let k = rint(3, 12); k > 0; k--) s.push([rnd(0.02, 0.08), Math.random() < 0.5 ? rnd(0, 0.15) : rnd(0.6, 1)]);
      break;
    case 'dead':
      s.push([rnd(1.5, 7) / (0.3 + fl), 0.02]);
      if (Math.random() < 0.6) for (let k = rint(2, 8); k > 0; k--) s.push([rnd(0.03, 0.12), Math.random() < 0.55 ? rnd(0.3, 1) : 0]);
      break;
    case 'dim': s.push([rnd(0.04, 0.3), rnd(0.32, 0.5)]); break;
    case 'buzz': s.push([rnd(0.016, 0.05), rnd(0.55, 1)]); break;
    default:
      s.push([rnd(2, 9), 1]);
      if (fl > 0 && Math.random() < fl * 0.35) for (let k = rint(1, 3); k > 0; k--) s.push([rnd(0.025, 0.07), rnd(0.15, 0.6)], [rnd(0.02, 0.06), 1]);
  }
}
function ignite(slow) {
  let tt = t + 0.12;
  units.forEach(u => {
    u.lv = 0; u.seq = [[Math.max(0, tt - t), 0]];
    for (let k = rint(1, 3) + (u.kind !== 'ok' ? rint(1, 4) : 0); k > 0; k--) u.seq.push([rnd(0.03, 0.09), rnd(0.5, 1)], [rnd(0.03, 0.14), 0]);
    if (u.kind === 'dead') u.seq.push([rnd(0.3, 2), 0.02]);
    tt += slow ? rnd(0.05, 0.16) : rnd(0.01, 0.05);
  });
}

function rebuild(keepState) {
  if (!mctx) mctx = mk(4, 4).getContext('2d');
  const old = units;
  layoutText();
  if (keepState && old.length === units.length) units.forEach((u, i) => { u.kind = old[i].kind; u.seq = old[i].seq; u.lv = old[i].lv; });
  else pickKinds();
  makeSprites();
}

// Halterung zeichnen: hinter den Röhren (Fuß der Halter, Platte, Kabel) und davor (Drahtschlaufen, Kappen)
function hardwareBack(ctx, avg) {
  const amb = Math.min(1, avg);
  if (settings.mount === 1) {
    const p = plate;
    if (!p) return;
    // Kabel hinter der Platte
    const cb = p.cable;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cb[0], cb[1]); ctx.bezierCurveTo(cb[2], cb[3], cb[4], cb[5], cb[6], cb[7]);
    ctx.strokeStyle = '#050506'; ctx.lineWidth = p.cw; ctx.stroke();
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3 * amb;
    ctx.save(); ctx.translate(-p.cw * 0.22, 0);
    ctx.strokeStyle = rgba(avgCol, 0.8); ctx.lineWidth = Math.max(1, p.cw * 0.25); ctx.stroke();
    ctx.restore();
    // Schatten der Plattenkante auf der Wand, dann die Kanten selbst: poliertes Acryl leitet das Licht zum Rand
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.55;
    rrect(ctx, p.x + fs * 0.02, p.y + fs * 0.07, p.w, p.h, p.r);
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(2, fs * 0.05); ctx.stroke();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
    rrect(ctx, p.x, p.y, p.w, p.h, p.r);
    ctx.fillStyle = rgba(avgCol, 0.025 * amb); ctx.fill();
    ctx.strokeStyle = rgba(avgCol, 0.55 * amb); ctx.lineWidth = Math.max(1.5, 1.6 * dpr); ctx.stroke();
    ctx.strokeStyle = rgba([255, 255, 255], 0.2 * amb); ctx.lineWidth = Math.max(0.6, 0.5 * dpr); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  } else {
    for (const u of units) {
      // Fuß der Röhrenhalter: kleiner Kunststoffsockel hinter der Röhre, vom Licht der Röhre angestrahlt
      for (const s of u.sup) {
        const R = Math.max(s.r * 2, 3.2 * dpr);
        ctx.globalAlpha = 0.6; ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(s.x + R * 0.12, s.y + R * 0.3, R * 1.1, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = '#121214';
        ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.7 * u.a + 0.12 * amb);
        ctx.strokeStyle = rgba(u.col.glow, 0.75); ctx.lineWidth = Math.max(1, R * 0.16);
        ctx.beginPath(); ctx.arc(s.x, s.y, R * 0.88, 0, TAU); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
      // Gummikappe der Elektrode hinter dem Röhrenende
      for (const e of u.el) {
        const R = Math.max(e.r * 1.6, 3.5 * dpr);
        ctx.globalAlpha = 1; ctx.fillStyle = '#070708';
        ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.5 * u.a + 0.08 * amb);
        ctx.strokeStyle = rgba(u.col.glow, 0.6); ctx.lineWidth = Math.max(1, R * 0.12);
        ctx.beginPath(); ctx.arc(e.x, e.y, R * 0.92, Math.PI * 0.95, Math.PI * 1.85); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  ctx.globalAlpha = 1;
}
function hardwareFront(ctx, avg) {
  const amb = Math.min(1, avg);
  if (settings.mount === 1) {
    const p = plate;
    if (!p) return;
    const h = p.capBase.width / 2;
    for (const [cx, cy] of p.caps) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx + p.so * 0.25, cy + p.so * 0.55, p.so * 1.05, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.drawImage(p.capBase, cx - h, cy - h);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = amb; ctx.drawImage(p.capLit, cx - h, cy - h);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    ctx.lineCap = 'round';
    for (const u of units) {
      for (const s of u.sup) {
        const c = Math.cos(s.a), sn = Math.sin(s.a), L = Math.max(s.r * 1.5, 3.4 * dpr);
        ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(24,24,28,0.92)'; ctx.lineWidth = Math.max(1.2, s.r * 0.3, 0.9 * dpr);
        ctx.beginPath(); ctx.moveTo(s.x - c * L, s.y - sn * L); ctx.lineTo(s.x + c * L, s.y + sn * L); ctx.stroke();
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.55 * u.a + 0.1 * amb);
        ctx.strokeStyle = rgba(u.col.core, 0.9); ctx.lineWidth = Math.max(0.5, s.r * 0.08);
        const o = s.r * 0.06;
        ctx.beginPath(); ctx.moveTo(s.x - c * L - sn * o, s.y - sn * L + c * o); ctx.lineTo(s.x + c * L - sn * o, s.y + sn * L + c * o); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
      // schwarz lackiertes Röhrenende, das nach hinten in die Kappe biegt
      for (const e of u.el) {
        const L = e.r * 1.3;
        ctx.globalAlpha = 0.96; ctx.strokeStyle = '#0c0c0e'; ctx.lineWidth = e.r * 2.15;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.dx * L, e.y + e.dy * L); ctx.stroke();
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, 0.35 * u.a + 0.1 * amb);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(0.6, e.r * 0.25);
        ctx.beginPath(); ctx.moveTo(e.x - e.dy * e.r * 0.45 - e.dx * e.r * 0.3, e.y + e.dx * e.r * 0.45 - e.dy * e.r * 0.3);
        ctx.lineTo(e.x - e.dy * e.r * 0.45 + e.dx * L, e.y + e.dx * e.r * 0.45 + e.dy * L); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  ctx.globalAlpha = 1;
}

return {
  maxDpr: 2,
  settings, controls,
  actionLabel: 'Einschalten',
  bindUI(api) { ui = api; },
  resize(w, h, d) {
    W = w; H = h; dpr = d; bgM = Math.ceil(8 * d);
    cam.resize(w, h);
    if (!mctx) { mctx = mk(4, 4).getContext('2d'); FONTS.forEach((_, i) => ensureCss(i)); ensureFont(settings.font); }
    makeLightCanvases(); genAlbedo();
    rebuild(true);
  },
  newPattern() { pickKinds(); },
  action() { ignite(true); },
  wake() { ignite(true); },
  change(id) {
    if (id === 'broken') { pickKinds(); return; }
    if (id === 'flicker' || id === 'video' || id === 'mount') return;
    if (id === 'wall') { genAlbedo(); return; }
    if (id === 'text') {
      // Sonderbuchstaben erkannt: passende Schriftgruppe wählen
      const raw = String(settings.text || ''), g = (FONTS[settings.font] || FONTS[0]).g;
      if (FRAKTUR_RE.test(raw) && g !== 'Altdeutsch' && FRAKTUR_IDX >= 0) { settings.font = FRAKTUR_IDX; if (ui) ui.set('font', FRAKTUR_IDX); }
      else if (SCRIPT_RE.test(raw) && g !== 'Schreibschrift' && SCRIPT_IDX >= 0) { settings.font = SCRIPT_IDX; if (ui) ui.set('font', SCRIPT_IDX); }
      ensureFont(settings.font);
      pendingText = 0.25; // erst nach kurzer Tipp-Pause neu berechnen
      return;
    }
    if (id === 'font') ensureFont(settings.font);
    rebuild(id === 'pos' || id === 'color' || id === 'tube');
  },
  frame(ctx, dt) {
    t += dt;
    if (pendingText > 0) { pendingText -= dt; if (pendingText <= 0) rebuild(false); }
    let sum = 0;
    for (const u of units) {
      if (!u.seq.length) nextSeq(u);
      const s = u.seq[0];
      s[0] -= dt; u.tg = s[1];
      if (s[0] <= 0) u.seq.shift();
      u.lv += (u.tg - u.lv) * Math.min(1, dt * 45);
      u.a = clamp(u.kind === 'buzz' ? u.lv * (0.85 + 0.15 * Math.random()) : u.lv, 0, 1);
      sum += u.a;
    }
    const avg = units.length ? sum / units.length : 0, vid = settings.video === 0;
    const sh = vid ? cam.shake(t, 0.8, dpr) : [0, 0], ox = sh[0], oy = sh[1];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(1, 0, 0, 1, ox, oy);
    ctx.imageSmoothingEnabled = true;
    // Wand: jedes Bild neu vom Licht der einzelnen Buchstaben beleuchtet
    if (alb && units.length && ln && lf) {
      for (const [c2, x2] of [[lf, lfx], [ln, lnx]]) {
        x2.globalCompositeOperation = 'source-over'; x2.globalAlpha = 1; x2.fillStyle = '#000'; x2.fillRect(0, 0, c2.width, c2.height);
        x2.globalCompositeOperation = 'lighter';
      }
      for (const u of units) {
        if (u.a < 0.01) continue;
        lfx.globalAlpha = u.a * u.lk; lfx.drawImage(u.lf, (u.lfX + bgM) * LF, (u.lfY + bgM) * LF);
        lnx.globalAlpha = u.a * u.lk; lnx.drawImage(u.ln, (u.lnX + bgM) * LN, (u.lnY + bgM) * LN);
      }
      // Licht mal Wandfarbe in halber Auflösung, dann doppelt hell auf den Bildschirm (so kippt die Farbe erst
      // ganz nah an der Röhre ins Weiße, wie bei einer echten Kamera)
      wcx.imageSmoothingEnabled = true; wcx.globalAlpha = 1;
      wcx.globalCompositeOperation = 'copy'; wcx.drawImage(lf, 0, 0, lf.width / LF * AS, lf.height / LF * AS);
      wcx.globalCompositeOperation = 'lighter'; wcx.drawImage(ln, 0, 0, ln.width / LN * AS, ln.height / LN * AS);
      wcx.globalCompositeOperation = 'multiply'; wcx.drawImage(alb, 0, 0);
      wcx.globalCompositeOperation = 'source-over';
      ctx.drawImage(wc, -bgM, -bgM, wc.width / AS, wc.height / AS);
      ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(wc, -bgM, -bgM, wc.width / AS, wc.height / AS);
      ctx.globalCompositeOperation = 'source-over';
    }
    hardwareBack(ctx, avg);
    // Röhren aus: milchiges Glas, vom Schild selbst beleuchtet
    ctx.globalAlpha = 0.12 + 0.6 * Math.min(1, avg);
    for (const u of units) ctx.drawImage(u.off, u.x + u.offX, u.y + u.offY);
    // Röhren an
    ctx.globalCompositeOperation = 'lighter';
    for (const u of units) {
      if (u.a < 0.01) continue;
      ctx.globalAlpha = u.a; ctx.drawImage(u.on, u.x + u.ox, u.y + u.oy);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    hardwareFront(ctx, avg);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // Kamera-Look
    if (vid) { cam.bloom(ctx, 0.4, 1); cam.vignette(ctx, 0.6); cam.grain(ctx, 0.045, dpr); }
  },
};

})();

// ---------- Rahmen: Leinwand, Einstellungen, Bedienung ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const S = E.settings, KEY = 'nw-leuchtreklame';
try { const sv = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in sv) if (k in S && typeof sv[k] === typeof S[k]) S[k] = sv[k]; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, E.maxDpr || 3);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h; cv.width = W; cv.height = H;
  E.resize(W, H, dpr);
}

// Regler und Auswahlknöpfe aus der Beschreibung des Effekts bauen
const box = document.getElementById('controls'), ui = {};
// Wert setzen und Anzeige nachziehen (auch für den Effekt selbst, z. B. automatische Schriftwahl)
const setVal = (id, v) => { S[id] = v; if (ui[id]) ui[id](v); save(); };
for (const c of E.controls) {
  const row = document.createElement('div'); row.className = 'row';
  if (c.type === 'range') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + ' <output></output></label>' +
      '<input id="' + c.id + '" type="range" min="' + c.min + '" max="' + c.max + '" step="' + (c.step || 1) + '">';
    box.appendChild(row);
    const el = row.querySelector('input'), out = row.querySelector('output'), fmt = c.fmt || String;
    if (c.track) { el.classList.add('track'); el.style.setProperty('--track', c.track); }
    ui[c.id] = v => { el.value = v; out.textContent = fmt(+v); if (c.swatch) el.style.setProperty('--sw', c.swatch(+v)); };
    ui[c.id](S[c.id]);
    el.addEventListener('input', () => { S[c.id] = +el.value; out.textContent = fmt(S[c.id]); if (c.swatch) el.style.setProperty('--sw', c.swatch(S[c.id])); save(); if (E.change) E.change(c.id); });
  } else if (c.type === 'choice' || c.type === 'grid') {
    // 'grid': viele Möglichkeiten in zwei Spalten, mit Zwischenüberschriften und eigener Schrift je Knopf
    row.innerHTML = '<span class="lbl">' + c.label + '</span><div class="' + (c.type === 'grid' ? 'grid' : 'seg') + '"></div>';
    box.appendChild(row);
    const wrap = row.querySelector('.grid, .seg'), btns = [];
    let group = null;
    c.options.forEach((o, i) => {
      if (o.group && o.group !== group) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = o.group; wrap.appendChild(h); group = o.group; }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = typeof o === 'string' ? o : o.label;
      if (o.font) b.style.fontFamily = o.font;
      if (o.weight) b.style.fontWeight = o.weight;
      b.addEventListener('click', () => { setVal(c.id, i); if (E.change) E.change(c.id); });
      wrap.appendChild(b); btns.push(b);
    });
    ui[c.id] = v => btns.forEach((b, j) => b.classList.toggle('on', j === v));
    ui[c.id](S[c.id]);
  } else if (c.type === 'text') {
    row.innerHTML = '<label for="' + c.id + '">' + c.label + '</label>' +
      '<input id="' + c.id + '" type="text" maxlength="' + (c.max || 20) + '" autocomplete="off" spellcheck="false">';
    box.appendChild(row);
    const el = row.querySelector('input'); el.value = S[c.id];
    ui[c.id] = v => { el.value = v; };
    el.addEventListener('input', () => { S[c.id] = el.value; save(); if (E.change) E.change(c.id); });
  }
}
if (E.bindUI) E.bindUI({ set: setVal });
if (E.hint) hint.textContent = E.hint;
document.getElementById('actBtn').textContent = E.actionLabel;
document.getElementById('newBtn').onclick = () => E.newPattern();
document.getElementById('actBtn').onclick = () => E.action();
document.getElementById('closeBtn').onclick = () => { sheet.hidden = true; };
// Berührung: Effekte mit E.touch bekommen Finger-Positionen (Gerätepixel). Kurzes Tippen ohne Bewegen
// öffnet weiterhin die Einstellungen, Wischen oder langes Halten nicht.
let dragged = false, downX = 0, downY = 0, downT = 0;
if (E.touch) {
  cv.style.touchAction = 'none';
  const P = (e, type) => E.touch(type, e.clientX * dpr, e.clientY * dpr, e.pointerId);
  cv.addEventListener('pointerdown', e => { dragged = false; downX = e.clientX; downY = e.clientY; downT = performance.now(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} P(e, 'down'); });
  cv.addEventListener('pointermove', e => {
    if (!e.buttons && e.pointerType === 'mouse') return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) dragged = true;
    P(e, 'move');
  });
  const up = e => { if (performance.now() - downT > 350) dragged = true; P(e, 'up'); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}
cv.addEventListener('click', () => { if (dragged) { dragged = false; return; } sheet.hidden = !sheet.hidden; hint.classList.add('gone'); });
setTimeout(() => hint.classList.add('gone'), 3500);

// Vollbild: immer echtes Vollbild versuchen; wenn die Ansicht es sperrt, bleibt die Leinwand ohne Bedienelemente
const fsBtn = document.getElementById('fsBtn');
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
let toastTimer = 0;
function toast(msg) {
  hint.textContent = msg; hint.classList.add('msg'); hint.classList.remove('gone');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => hint.classList.add('gone'), 4000);
}
const fsBlocked = () => { if (!isFs()) toast('In dieser Ansicht ist Vollbild gesperrt. Öffne die Vorschau-Karte, dort geht es. Antippen holt die Einstellungen zurück.'); };
fsBtn.onclick = () => {
  sheet.hidden = true;
  try {
    if (isFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { fsBlocked(); return; }
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.then) r.then(() => setTimeout(fsBlocked, 300), fsBlocked); else setTimeout(fsBlocked, 500);
  } catch (e) { fsBlocked(); }
};
const fsLabel = () => { fsBtn.textContent = isFs() ? 'Vollbild beenden' : 'Vollbild'; };
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);

// Start
addEventListener('resize', resize);
resize();
E.newPattern();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  E.frame(ctx, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// So tun, als würde das Handy entsperrt: beim Öffnen und wenn die Seite wieder sichtbar wird
setTimeout(() => E.wake(), 450);
document.addEventListener('visibilitychange', () => { if (!document.hidden) E.wake(); });
window.__nw = { E, S };
})();
</script>
