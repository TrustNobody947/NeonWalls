name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle direkt in fester Version, dadurch braucht das Repo keine Binärdateien
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK bauen
        run: gradle assembleRelease --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk NeonWalls.apk

      # Fertige APK als Download unter "Releases" veröffentlichen
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Walls ${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy einfach NeonWalls.apk antippen und herunterladen.
            Direkter Link zur jeweils neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/NeonWalls.apk
          files: NeonWalls.apk
          make_latest: true
