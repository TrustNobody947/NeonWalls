name: APK bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - 'vorschau/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle direkt in fester Version, dadurch braucht das Repo keine Binärdateien
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK bauen
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      # Bei einem Fehler die wichtigsten Zeilen als Fehlerhinweise ausgeben (zur Fehlersuche)
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          log = open('build.log', encoding='utf-8', errors='replace').read()
          parts = [m.group(0) for m in re.finditer(r'^e: .*$', log, re.M)]
          i = log.find('What went wrong')
          if i >= 0:
              parts.append(log[i:i + 3500])
          if not parts:
              parts.append(log[-3500:])
          enc = lambda s: s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for p in parts[:40]:
              print('::error::' + enc(p[:3500]))
          EOF

      - name: APKs umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk NeonWalls.apk
          cp plasma/build/outputs/apk/release/plasma-release.apk ElektroPlasma.apk
          cp brokenscreen/build/outputs/apk/release/brokenscreen-release.apk BrokenScreen.apk

      # Fertige APK als Download unter "Releases" veröffentlichen
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Walls ${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy die gewünschte APK antippen und herunterladen.
            NeonWalls.apk – die Sammlung (Broken Screen, Pegelanzeige)
            ElektroPlasma.apk – Elektro-Plasma als eigene App
            BrokenScreen.apk – Broken Screen als eigene App
            Direkte Links zur jeweils neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/NeonWalls.apk
            https://github.com/${{ github.repository }}/releases/latest/download/ElektroPlasma.apk
            https://github.com/${{ github.repository }}/releases/latest/download/BrokenScreen.apk
          files: |
            NeonWalls.apk
            ElektroPlasma.apk
            BrokenScreen.apk
          make_latest: true
